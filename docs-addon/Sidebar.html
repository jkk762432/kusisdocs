<!DOCTYPE html>
<html lang="ko"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--p:#8B0029;--soft:#F8EEF1;--ink:#1C1917;--mute:#78716C;--line:#E7E5E4;--ok:#2F6F4F;--bad:#B42318;--bg:#FAFAF9}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 "Noto Sans KR",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px}
.top b{color:var(--p);font-size:14px}
.top .st{margin-left:auto;font-size:11px;color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C4C0BC;margin-right:4px}
.dot.on{background:var(--ok)}
nav{display:flex}
nav button{flex:1;border:0;background:none;padding:8px 0;border-bottom:2px solid transparent;color:var(--mute);cursor:pointer}
nav button.on{color:var(--p);border-color:var(--p);font-weight:700}
main{padding:10px}
section[hidden]{display:none}
h4{margin:14px 0 6px;font-size:12px;color:var(--p)}
h4:first-child{margin-top:0}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row>*{min-width:0}
.row .grow{flex:1}
input[type=text],input[type=password],input[type=email],input[type=search],select,textarea{width:100%;border:1px solid #D6D3D1;border-radius:6px;padding:6px 8px;background:#fff}
textarea{resize:vertical;min-height:54px}
label.l{display:block;font-size:11px;color:var(--mute);margin:6px 0 2px}
.btn{border:1px solid #D6D3D1;background:#fff;border-radius:6px;padding:6px 9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F5F5F4}
.btn.p{background:var(--p);border-color:var(--p);color:#fff}
.btn.p:hover{background:#6F0020}
.btn.s{padding:3px 7px;font-size:12px}
.btn.bad{color:var(--bad);border-color:#F1B8B3}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{display:block;width:100%}
.muted{color:var(--mute);font-size:12px}
.warn{color:var(--bad);font-size:12px}
.ok{color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;background:#fff;cursor:pointer}
.chip.joined{border-color:var(--ok);color:var(--ok)}
.chip.chair{background:var(--p);color:#fff;border-color:var(--p)}
.chip.off{color:#A8A29E;background:#F5F5F4}
.ag{display:flex;gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.ag:first-child{border-top:0}
.ag .t{flex:1;min-width:0;font-size:12px}
.ag .t small{color:var(--mute)}
.ag.cur{background:var(--soft);margin:0 -9px;padding:5px 9px}
.tag{color:var(--p);font-weight:700}
.step{display:flex;gap:3px;margin:6px 0}
.step i{flex:1;height:5px;border-radius:3px;background:#E7E5E4}
.step i.d{background:var(--p)}
.live{background:#FFF7E6;border:1px solid #F7D9A0;border-radius:6px;padding:5px 8px;margin-bottom:8px;font-size:12px}
.live b{color:var(--p)}
.vrow{display:flex;align-items:center;gap:4px;padding:3px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .n{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vrow label{font-size:11px;white-space:nowrap}
.vrow.unset .n{color:var(--bad)}
.tally{font-size:12px;margin:6px 0}
.tally.okk{color:var(--ok);font-weight:700}
.art{border-top:1px solid var(--line);padding:5px 0}
.art:first-child{border-top:0}
.art .h{display:flex;gap:4px;align-items:center}
.art .h button.tt{flex:1;text-align:left;border:0;background:none;padding:0;cursor:pointer;font-size:12px}
.art .b{margin:4px 0 2px;font-size:12px;color:#44403C}
.art .b p{margin:2px 0}
mark{background:#FDE68A}
#toast{position:fixed;left:10px;right:10px;bottom:10px;background:#292524;color:#fff;border-radius:6px;padding:8px 10px;font-size:12px;z-index:9}
#toast[hidden]{display:none}
.pend{font-size:11px;color:var(--mute);text-align:right}
.refs span{display:inline-block;background:var(--soft);border-radius:4px;padding:1px 6px;margin:2px 3px 0 0;font-size:11px}
details{margin-bottom:6px}
summary{cursor:pointer;font-weight:700;color:var(--p);font-size:12px;margin-bottom:4px}

</style></head>
<body>
<header>
  <div class="top"><b>속기</b><span class="st"><span class="dot" id="dot"></span><span id="st">연결 전</span></span></div>
  <nav id="nav"><button data-tab="run" class="on">진행</button><button data-tab="write">안건지</button><button data-tab="rules">회칙</button><button data-tab="set">설정</button></nav>
</header>
<main>
<section id="tab-run">
  <div id="r-login"></div>
  <div id="r-live"></div>
  <div id="r-room"></div>
  <div id="r-members"></div>
  <div id="r-body"></div>
  <div id="r-vote"></div>
  <div id="r-manual"></div>
  <div class="pend" id="pend"></div>
</section>
<section id="tab-write" hidden>
  <details open><summary>① 회의 개요 · 소집 공고</summary><div class="card" id="w-meet"></div></details>
  <details open><summary>② 안건 추가</summary><div class="card" id="w-ag"></div></details>
  <details><summary>③ 안건 여러 개 한 번에</summary><div class="card" id="w-bulk"></div></details>
  <details open><summary>④ 속기 위치</summary><div class="card" id="w-mark"></div></details>
</section>
<section id="tab-rules" hidden>
  <div class="card">
    <input type="search" id="q-rule" placeholder="조 번호(예: 86) 또는 낱말">
    <div class="row"><select id="q-ch" class="grow"></select></div>
    <div class="muted" id="q-sub"></div>
  </div>
  <div class="card" id="q-list"></div>
</section>
<section id="tab-set" hidden>
  <div class="card" id="s-acct"></div>
  <div class="card" id="s-meet"></div>
  <div class="card" id="s-mem"></div>
  <div class="card" id="s-pin"></div>
</section>
</main>
<div id="toast" hidden></div>
<script>window.RULES={"name":"고려대학교 자유전공학부 학생회칙","outline":[{"name":"제1장 총칙","sections":[]},{"name":"제2장 의결기구","sections":["제1절 통칙","제2절 학생총회","제3절 학생총투표","제4절 학생대표자회","제5절 학부운영위원회","제6절 비상대책위원회"]},{"name":"제3장 집행기구","sections":["제1절 학부 학생회장단","제2절 집행위원회","제3절 임시집행위원회"]},{"name":"제4장 산하기구","sections":["제1절 반 학생회","제2절 자치단체"]},{"name":"제5장 독립기구","sections":["제1절 통칙","제2절 선거관리위원회","제3절 투표관리위원회"]},{"name":"제6장 특별기구","sections":["제1절 통칙","제2절 인준"]},{"name":"제7장 선거","sections":["제1절 학부 학생회장단 선거","제2절 동시선거"]},{"name":"제8장 재정","sections":["제1절 통칙","제2절 자산","제3절 회계ㆍ심의"]},{"name":"제9장 자치공간","sections":[]},{"name":"제10장 회칙ㆍ세칙ㆍ규칙","sections":["제1절 회칙 개정","제2절 세칙","제3절 규칙","제4절 해석"]},{"name":"부칙","sections":[]}],"articles":[{"no":1,"sub":0,"add":false,"title":"명칭","lines":["본회는 고려대학교 자유전공학부 학생회라 한다."],"ch":"제1장 총칙","sec":""},{"no":2,"sub":0,"add":false,"title":"목적","lines":["① 본회는 민주적이고 자율적인 학생자치활동을 통하여 회원 간의 결속을 강화하고 회원의 권익 신장을 도모함을 목적으로 한다.","② 본회는 자유로운 진리의 탐구와 창조적이고 진보적인 대학 문화의 건설을 추구하여 사회발전에 능동적으로 이바지함을 목적으로 한다.","③ 본회는 시대의 불의에 맞서 사회적 연대를 구축하고 침해된 정의의 회복을 위하여 대내외에서 주체적으로 행동함을 목적으로 한다.","④ 본회는 본회의 자산 및 자치공간과 회원이 지닌 권리를 보호함을 목적으로 한다.","⑤ 본회는 법률적 기초 소양 및 다양한 영역에서의 복합적 전문성을 갖춘 공적 영역의 선도적 지도자를 양성한다는 교육목적을 달성하기 위하여 노력하며, 제1전공이 다른 회원들 간의 교류를 장려함을 목적으로 한다."],"ch":"제1장 총칙","sec":""},{"no":3,"sub":0,"add":false,"title":"소재지","lines":["본회는 고려대학교 서울캠퍼스 법학관 구관, 법학관 신관 및 CJ법학관에 위치한다."],"ch":"제1장 총칙","sec":""},{"no":4,"sub":0,"add":false,"title":"회원","lines":["① 고려대학교 자유전공학부 소속인 자는 본회의 회원이 된다.","② 졸업ㆍ자퇴ㆍ퇴학 등으로 고려대학교 서울캠퍼스 학부 과정 소속이 아니게 된 사람과 총학생회 제명으로 인해 총학생회 회원직을 박탈당한 사람은 그 즉시 회원 자격을 잃으며, 정학 등의 사유로 등교가 정지된 자는 그 기간 회원 자격이 정지된다.","③ 제2항에도 불구하고 회원의 자격이 부당하게 정지 또는 박탈된 자는 학부운영위원회 출석 위원 3분의 2 이상의 찬성으로 회원 지위를 회복할 수 있다.","④ 본회의 회원 중 고려대학교 서울캠퍼스 학부 과정 재학생은 다음 각호의 기간 본회의 정회원이 된다. 단, 학기 중 휴학한 자는 그 즉시 준회원이 된다.","1. 1학기 재학생: 1학기 개강일로부터 2학기 개강일 전날까지","2. 2학기 재학생: 2학기 개강일로부터 이듬해 1학기 개강일 전날까지","⑤ 본회의 회원 중 고려대학교 서울캠퍼스 학부 과정 휴학생은 준회원이 된다.","⑥ 본회의 회원 중 고려대학교 서울캠퍼스 학부 과정 수료생은 수료회원이 된다.","⑦ 준회원ㆍ수료회원 중에서 다음 각호의 등록 기간에 등록 절차를 이행한 자는 남은 기간 정회원이 된다. 단, 자유전공학부 학부ㆍ반 학생회장단 선거의 특수성을 고려하여 선거 후보자 등록 마감일 다음 날부터 당선 공고일까지는 정회원으로 등록할 수 없다. 그 밖의 정회원 등록에 관한 사항은 규칙으로 정한다.","1. 1학기 정회원 등록 기간: 1학기 개강일부터 2학기 개강일 전날까지","2. 2학기 정회원 등록 기간: 2학기 개강일부터 이듬해 1학기 개강일 전날까지","⑧ 본회의 회원 중 다음 각호에 해당하는 회원은 신입생 회원이라고 한다.","1. 고려대학교에 입학한 지 2학기가 지나지 않은 회원","2. 편입학ㆍ소속 변경 등으로 자유전공학부 재학생이 된 지 2학기가 지나지 않은 회원","⑨ 본회의 회원 중 제8항 제1호에 해당하는 회원과 두 학번 이상 차이가 나는 회원은 고학번 회원이라고 한다.","⑩ 본회의 회원 중 순수정원외 및 외국인 학생은 국제 회원이라고 한다."],"ch":"제1장 총칙","sec":""},{"no":5,"sub":0,"add":false,"title":"회원의 권리","lines":["① 본회의 회원은 성별ㆍ성적 지향ㆍ성 정체성ㆍ인종ㆍ사상ㆍ종교ㆍ장애 등에 의하여 차별받지 않을 권리를 가진다.","② 본회의 회원은 본회의 모든 자치활동에 참여할 권리를 가진다.","③ 본회의 회원은 양심ㆍ사상ㆍ종교의 자유를 가지며, 이에 따라 자유롭게 활동할 권리를 가진다.","④ 본회의 회원은 집회ㆍ결사의 자유를 가진다.","⑤ 본회의 회원은 회칙에 따라 본회의 활동과 운영 전반에 관하여 보고받고 의견을 개진할 권리를 가진다.","⑥ 본회의 회원은 본회를 부인하거나 정당한 학생 자치활동을 침해하는 것에 저항할 권리를 가진다.","⑦ 본회의 회원은 본회가 지니는 급부를 적절한 시기에 제공받을 권리를 가진다.","⑧ 본회의 회원은 자치공간 및 본회 자산을 누릴 권리를 가진다.","⑨ 본회의 회원은 회칙에 근거한 선거권을 가진다.","⑩ 본회의 정회원은 회칙에 근거한 피선거권을 가진다.","⑪ 본회의 회원이 지닌 자유와 권리는 회칙에 열거되지 아니한 이유로 경시되지 아니한다. 다만, 회원의 모든 자유와 권리는 그 본질적인 내용을 침해하지 아니하는 범위 내에서 안전보장ㆍ질서유지 또는 공공복리를 위하여 필요한 경우에만 제한할 수 있다."],"ch":"제1장 총칙","sec":""},{"no":6,"sub":0,"add":false,"title":"회원의 의무","lines":["① 본회의 회원은 성별ㆍ성적 지향ㆍ성 정체성ㆍ인종ㆍ사상ㆍ종교ㆍ장애 등을 이유로 차별하지 않을 의무를 지닌다.","② 본회의 회원은 회칙을 준수할 의무를 지닌다.","③ 본회의 회원은 본회가 결정한 사항을 준수할 의무를 지닌다.","④ 본회의 회원은 회비를 납부할 의무를 지닌다.","⑤ 본회의 회원은 본회의 자산을 보호할 의무를 지닌다."],"ch":"제1장 총칙","sec":""},{"no":7,"sub":0,"add":false,"title":"기구","lines":["① 본회는 민주적이고 효율적인 운영을 통한 학생자치의 실현을 위하여 다음 각호의 의결기구, 집행기구, 산하기구, 독립기구 및 특별기구를 둔다.","1. 의결기구: 학생총회, 학생대표자회, 학부운영위원회, 비상대책위원회","2. 집행기구: 학부 학생회장단, 집행위원회, 임시집행위원회","3. 산하기구: 반 학생회, 자치단체","4. 독립기구: 선거관리위원회, 투표관리위원회","5. 특별기구","② 본회의 각 기구는 제5조에 따른 회원의 권리가 내ㆍ외부적으로 침해받지 않도록 항상 노력하여야 하며, 회원의 권리가 침해될 때는 이를 적극적으로 수호하여야 한다.","③ 본회의 각 기구는 본회 각 기구의 자산 및 자치공간 등을 확보하고 보호ㆍ관리하여야 한다.","④ 본회의 각 기구는 서로 교류하고, 본회 사업에 협력하여야 한다.","⑤ 본회의 각 기구는 회원의 개인정보를 보호하여야 한다."],"ch":"제1장 총칙","sec":""},{"no":8,"sub":0,"add":false,"title":"학교 운영 참여","lines":["① 본회는 본회의 활동에 관하여 학교 당국과의 협의 또는 조정이 필요한 경우 학교 운영에 적극적으로 참여하여 의견을 개진하고, 학교 당국에 자료 제출을 요청할 수 있다.","② 본회는 다음 각호의 경우에 관하여 관련 진행 상황 및 결정 사항을 회원에게 공고하여야 한다.","1. 본회의 활동에 관련된 회원의 징계 사항에 관해 회원을 변호할 필요가 있는 경우","2. 본회의 회원의 자치활동과 권익 보호가 필요한 경우","3. 자유전공학부 발전 방향 설정, 학제 개편, 학칙 개정 등의 임박하거나 이미 결정된 학교의 정책 및 결정 사항이 본회 회원의 이익에 중대한 변화를 일으키는 경우","4. 그 밖의 본회의 목적에 관련된 중요 사항"],"ch":"제1장 총칙","sec":""},{"no":9,"sub":0,"add":false,"title":"대표자의 책임","lines":["학부 학생회장단, 학부운영위원 및 학생대표자회 대의원은 본회의 대표자로서 본회의 민주적이고 효율적인 운영과 각 기구의 협력을 통하여 그 운영 목적을 달성할 수 있도록 주어진 역할을 책임 있게 수행하여야 한다."],"ch":"제1장 총칙","sec":""},{"no":10,"sub":0,"add":false,"title":"겸직 금지","lines":["① 본회의 회원은 다음 각호의 직을 동시에 2개 이상 가질 수 없다.","1. 학부 학생회장과 학부 부학생회장","2. 각 반 학생회장과 반 부학생회장","3. 각 반 고학번 대표와 반 신입생 대표","4. 각 자치단체장","5. 그 밖의 학생대표자회 대의원 자격이 부여될 수 있는 직책","② 반 학생회장은 집행위원의 직을 겸직하기 위해서는 학생대표자회의 의결로 허가를 받아야 한다."],"ch":"제1장 총칙","sec":""},{"no":11,"sub":0,"add":false,"title":"당연퇴직","lines":["① 다음 각호에 해당하는 자가 학칙에서 정한 사유 등에 따라 본회의 회원 자격을 잃게 되는 경우 그 시점부터 당연퇴직한다. 단, 정학 등의 사유로 회원 자격이 정지된 사람은 그러하지 아니한다.","1. 본회의 대표자","2. 집행위원","3. 특별기구 회원","4. 제1호부터 제3호까지의 직에 준하는 자","5. 그 밖의 본회의 회원 자격을 요건으로 하여 회칙ㆍ세칙 및 규칙에 따라 직위를 수행하는 자","② 제1항에 해당하는 사람이 제4조 제3항에 따른 절차 등을 통하여 회원 지위를 회복할 때는 그 회원 자격을 잃게 된 시점으로 소급하여 본회에서 수행한 직위의 경력을 인정한다. 단, 해당 경력의 소급 인정만으로는 그 기간에 있었던 사실상 또는 법률상 행위의 추인을 주장할 수 없다.","③ 제10조를 위반한 자는 마지막으로 갖게 된 직을 제외한 나머지 직에서 당연퇴직한다. 단, 제10조 제1항 제1호의 직은 선후관계를 불문하고 그 직을 제외한 나머지 직에서 당연퇴직한다."],"ch":"제1장 총칙","sec":""},{"no":12,"sub":0,"add":false,"title":"사무 처리","lines":["① 본회는 간소화ㆍ표준화ㆍ정보화를 통하여 효율적으로 사무를 처리하여야 한다.","② 정확과 신속을 기하고 책임의 소재를 분명히 하기 위하여 본회의 사무 처리와 대표자의 행위는 문서로 함을 원칙으로 한다.","③ 본회에서 장기간에 걸쳐 반복적으로 사용하는 문서로서 정형화할 수 있는 문서는 특별한 사유가 없으면 서식으로 정하여 사용한다.","④ 본회의 회칙ㆍ세칙 및 규칙에서 공고하도록 한 사항은 회원들이 해당 공고를 쉽게 접할 수 있도록 1개 이상의 오프라인 게시판 또는 온라인 플랫폼에 게시하여야 하며, 가시성이 확보되도록 공고의 모양을 정하여야 한다.","⑤ 그 밖의 사무 처리에 관한 세부적인 사항은 학부운영위원회의 의결로 ｢고려대학교 총학생회 사무처리세칙｣을 준용한다."],"ch":"제1장 총칙","sec":""},{"no":13,"sub":0,"add":false,"title":"기록물 관리","lines":["① 본회의 모든 활동은 기록되고, 기록물이 각 활동의 근거가 되는 것을 원칙으로 한다.","② 본회는 지속적이고 체계적인 기록물 관리를 위하여 적극 노력하여야 하며, 기록물 관리기관이 효율적으로 기록물을 관리할 수 있도록 지원하여야 한다.","③ 기록물의 생산ㆍ수집 이후에는 임의로 수정, 훼손하거나 폐기할 수 없다. 단, 다음 각호에 해당하면 각호에서 정한 목적에 어긋나지 않는 범위 내에서 게시물을 수정할 수 있다.","1. 회의록의 내용이 실제 발언과 부합하지 않은 것을 개의일로부터 7일 이내에 발견한 경우","2. 온라인 플랫폼에 올린 게시물의 탈ㆍ오자 수정이 필요한 경우","3. 온라인 플랫폼에 올린 게시물의 내용에 중대한 하자를 발견하여 하자의 치유를 위한 수정 및 비공개 조치가 필요한 경우","4. 온라인 플랫폼에 중복게시물을 올려 비공개 조치가 필요한 경우","④ 본회가 생산ㆍ수집하는 모든 기록물은 회원들에게 공개되어야 하고 본회의 행정 사무, 의사결정 및 학술 연구 등의 활동을 위하여 언제든지 참고할 수 있도록 투명하게 관리되어야 한다.","⑤ 본회가 수집한 개인정보는 당사자의 동의를 얻었거나 명확한 근거를 가진 정당한 목적이 있을 때만 열람ㆍ활용할 수 있다.","⑥ 본회의 회원 또는 학술적 목적 및 공익을 위하여 본회의 기록물을 활용하려는 자는 본회의 모든 기록물에 대한 접근권이 있으며 정보공개청구로 기록물을 열람ㆍ활용할 수 있다.","⑦ 본회의 각 기구는 제6항에 따른 정보공개청구를 거부할 수 없다. 단, 다음 각호에 해당하면 학부운영위원회의 의결로 청구한 사항의 일부만 공개하도록 할 수 있다.","1. 본회의 회원이 아닌 자가 정보 공개를 청구할 때","2. 특정 회원의 개인정보 유출이 우려될 때","3. 본회 회원의 이익에 심각한 감소를 초래할 때","4. 기타 공익적 목적이 있을 때","⑧ 그 밖의 기록물 관리에 관한 세부적인 사항은 학부운영위원회의 의결로 ｢고려대학교 총학생회 사무처리세칙｣을 준용한다."],"ch":"제1장 총칙","sec":""},{"no":14,"sub":0,"add":false,"title":"준용","lines":["① 본회는 각 의결기구의 의결로 본회 상위기구의 회칙, 세칙 및 규칙을 준용할 수 있다.","② 제1항에도 불구하고 특별한 규정이 있는 경우 본회는 각 의결기구의 의결 없이도 본회 상위기구의 회칙, 세칙 및 규칙을 준용한다."],"ch":"제1장 총칙","sec":""},{"no":15,"sub":0,"add":false,"title":"기본이념","lines":["본회의 의결기구는 본회를 대표하는 의사를 결정하는 기구로서 민주적이고 공정하며 효율적인 절차에 따라 운영되어야 한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":16,"sub":0,"add":false,"title":"위계","lines":["① 본회의 의결기구는 학생총회, 학생대표자회, 학부운영위원회 순으로 위계가 있다.","② 하위 의결기구의 의사결정 내용은 상위 의결기구의 의사결정 내용과 합치되는 범위 내에서 효력을 지닌다.","③ 하위 의결기구에서 의결할 수 있는 사항은 해당 의결기구보다 상위 의결기구에서도 의결할 수 있다.","④ 하위 의결기구에서 가중된 요건으로 의결하여야 하는 사항을 상위 의결기구에서 의결하고자 할 때 특별한 규정이 없으면 일반의결요건으로 의결한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":17,"sub":0,"add":false,"title":"회기","lines":["① 본회 의결기구의 회기는 다음 각호의 기간으로 나눈다.","1. 제1회기: 2학기 종강일 다음 날부터 1학기 개강일 전날까지","2. 제2회기: 1학기 개강일부터 1학기 종강일까지","3. 제3회기: 1학기 종강일 다음 날부터 2학기 개강일 전날까지","4. 제4회기: 2학기 개강일부터 2학기 종강일까지","② 본회 의결기구의 회기는 원활한 운영을 위하여 필요한 경우 다음 각호의 기간으로 표현할 수 있다.","1. 상반기: 금년도 제2회기 및 금년도 제3회기","2. 하반기: 금년도 제4회기 및 익년도 제1회기"],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":18,"sub":0,"add":false,"title":"의장","lines":["① 본회 의결기구의 의장은 학부 학생회장으로 함을 원칙으로 한다.","② 의장은 본회 의결기구를 대표하고 의사를 정리하며, 질서를 유지하고 사무를 감독한다.","③ 의장은 회칙에 따라 공정하고 효율적으로 회의를 진행하여야 한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":19,"sub":0,"add":false,"title":"학부 부학생회장의 의장 직무대리","lines":["학부 부학생회장은 학부 학생회장이 권한을 위임하거나 사고일 때에 학부 학생회장의 직무를 대행한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":20,"sub":0,"add":false,"title":"임시의장","lines":["① 다음 각호 중 하나에 해당하는 사유로 학부 학생회장단이 의장에서 물러나면 각 의결기구는 학부운영위원 중 1인을 임시의장으로 선출한다.","1. 학부 학생회장단 전원이 사고일 때","2. 학부 학생회장단에 대한 탄핵안이 상정되거나 발의되었을 때","3. 제21조에 따라 의장이 물러날 때","② 학생총회 또는 학생대표자회에 대한 소집요구가 있을 때 제1항 제1호 및 제2호에 해당하면 다음 각호 중 하나에 따라 인준받은 학부운영위원이 해당 의결기구의 회의를 소집한다.","1. 학생총회: 학생대표자회에서 인준","2. 학생대표자회: 학부운영위원회에서 인준","③ 제2항에도 불구하고 제31조 제1항 제3호에 따른 학생총회의 소집요구가 있을 때 제1항 제1호에 해당하면 학부운영위원회에서 인준받은 학부운영위원이 학생총회를 소집한다.","④ 학생총회 또는 학생대표자회는 개의 직후 의결로 제2항 및 제3항에 따라 회의를 소집한 임시의장을 재인준한다.","⑤ 학부운영위원회에 대한 소집요구가 있을 때 또는 특별한 규정으로 인하여 학부운영위원회를 소집하여야 할 때 제1항 제1호 및 제2호에 해당하면 학부운영위원회 재적 위원 3분의 2 이상의 출석과 출석 위원 3분의 2 이상의 찬성으로 회의를 개의하며, 학부운영위원 중 호선되는 1인을 임시의장으로 한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":21,"sub":0,"add":false,"title":"의장 직무의 제한","lines":["① 의장은 학생총회와 학생대표자회를 주재하는 동안 토론에 참여할 수 없으며, 토론에 참여하고자 한다면 해당 안건의 심의가 끝날 때까지 의장에서 물러나야 한다. 단, 제안 설명, 질의와 정보요구는 그러하지 아니한다.","② 학부 학생회장단이 의장일 때 의장은 학생총회와 학생대표자회에서 다음 각호에 해당하는 안건의 심의ㆍ의결에 관하여서는 해당 안건의 심의가 끝날 때까지 의장에서 물러나야 한다.","1. 의장 개인과 자기 관련성이 있는 안건","2. 집행위원장과 집행위원의 해임 안건","3. 학부 학생회장단과 집행위원회의 결정 사항 변경에 관한 안건"],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":22,"sub":0,"add":false,"title":"사무ㆍ재정","lines":["① 의결기구의 사무 처리는 집행위원회가 담당하며, 학부운영위원은 이에 최대한 협조할 의무 및 감시ㆍ감독할 의무를 지닌다.","② 집행위원회는 속기의 방법으로 회의록을 작성하고 다음 각호의 사항을 기재하여야 한다.","1. 회의 장소","2. 개의ㆍ정회 및 산회의 일시","3. 개의 당시와 안건 의결 당시의 출석 구성원 명단","4. 부의 안건의 제목 및 내용","5. 발언자와 의사 표명의 내용","6. 표결 결과 (기명투표의 경우 각 구성원의 표결 사항을 기재)","7. 의장 또는 각 의결기구가 필요하다고 인정하는 사항","③ 의장은 개의일로부터 3일 이내에 제2항의 회의록을 공개하고 회의 결과를 공고함을 원칙으로 한다. 단, 필요한 경우 그 기한을 7일까지 연장할 수 있다.","④ 본회는 의결기구의 원활한 운영을 위한 재원을 마련하여야 한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":23,"sub":0,"add":false,"title":"긴급한 사항","lines":["① “긴급한 사항”이란 회의 소집 과정을 생략해서라도 긴급하게 회의를 소집하여야 할 사항이거나, 그렇게 하는 것이 더 효율적이라고 판단되는 사항을 말한다.","② 각 의결기구의 의장은 긴급한 사항이 있을 때 이 회칙이 정하는 바에 따라 소집요구 없이도 학생총회와 학생대표자회를 소집할 수 있다.","③ 제2항에 따라 회의가 소집되는 경우 해당 의결기구는 개의 직후 긴급한 사항의 성립 여부에 관하여 심의한다. 긴급한 사항은 다음 중 하나로 성립되며, 긴급한 사항이 성립되지 않았을 때 해당 회의는 즉시 산회한다.","1. 학생총회: 출석 회원 과반수의 찬성","2. 학생대표자회: 출석 대의원 3분의 2 이상의 찬성","④ 긴급한 사항을 다음 각호의 목적만으로 주장하는 것은 허용되지 아니한다.","1. 소집 요건을 완화하고자 하는 목적","2. 공고 기간ㆍ절차를 단축하고자 하는 목적","⑤ 제2항에도 불구하고 가중된 요건으로 의결하여야 하는 안건을 심의하는 회의는 긴급한 사항으로 소집할 수 없다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":24,"sub":0,"add":false,"title":"안건의 발의","lines":["① 안건 발의는 각 의결기구에서 정한 발의 요건에 따른다.","② 정기회의를 제외한 회의에서 소집공고부터 산회 전까지의 안건 발의는 허용되지 아니한다.","③ 정기회의의 소집공고부터 산회 전까지 발의된 추가 안건에 관하여서는 각 의결기구의 의결로 안건의 상정 여부를 결정한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":25,"sub":0,"add":false,"title":"연서의 심의","lines":["① 의결기구의 소집요구 및 안건 발의를 위한 연서는 ｢고려대학교 총학생회 사무처리세칙｣에서 정한 서식을 준용한다.","② 학생총회 또는 학생대표자회에 대한 소집요구 및 안건 발의가 연서에 따라 이루어졌을 때 특별한 규정이 없는 한 학부운영위원회는 지체 없이 회의를 소집하여 연서에서 형식상의 결함을 심의한다.","③ 학부운영위원회의 소집요구 및 안건 발의가 연서에 따라 이루어졌을 때 학부운영위원회는 개의 직후 연서에서 형식상의 결함을 심의한다.","④ 각 의결기구는 연서의 서식 및 기재 정보가 ｢고려대학교 총학생회 사무처리세칙｣에 따른 규정과 맞지 않으면 연서가 무효하다고 볼 수 있다. 이때 해당 의결기구는 그 무효 판단의 근거를 회원에게 자세히 설명하기 위하여 노력하여야 한다.","⑤ 의결기구의 구성원과 방청인은 연서에 기재된 개인정보에 대하여 비밀을 유지할 의무를 지닌다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":26,"sub":0,"add":false,"title":"안건의 의결","lines":["① 각 의결기구는 특별한 규정이 없는 한 재적 구성원 과반수의 출석과 출석 구성원 과반수의 찬성으로 안건을 의결한다.","② 다음 각호 중 어느 하나에 해당하면 모두 부결된 것으로 된다.","1. 가부동수일 때","2. 과반의 의견이 없을 때","3. 기권이 과반수일 때","③ 의결 요건의 기준이 되는 출석 구성원 수는 각 안건의 의결 당시를 기준으로 계산한다.","④ 의결기구의 의결권은 모든 구성원이 평등하게 가지며, 직접 출석하여 행사하여야 한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":27,"sub":0,"add":false,"title":"방청ㆍ발언권","lines":["① 본회의 회원은 각 의결기구를 방청할 수 있다.","② 본회의 회원은 각 의결기구에서 발언할 수 있는 권리를 가진다.","③ 의장은 질서유지 및 효율적인 의사 진행을 위하여 방청인 수를 제한하거나 회원의 발언권을 제한할 수 있으며, 회의장 안의 질서를 현저히 방해하는 방청인의 퇴장을 명할 수 있다.","④ 의결기구의 구성원과 방청인의 자리는 구분되도록 배치한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":28,"sub":0,"add":false,"title":"회의진행세칙","lines":["그 밖의 의결기구의 회의 진행에 관한 사항은 ｢고려대학교 총학생회 회의진행세칙｣을 준용한다."],"ch":"제2장 의결기구","sec":"제1절 통칙"},{"no":29,"sub":0,"add":false,"title":"지위","lines":["학생총회는 본회의 최고의결기구이다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":30,"sub":0,"add":false,"title":"구성","lines":["학생총회는 본회의 회원 전원으로 구성된다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":31,"sub":0,"add":false,"title":"소집","lines":["① 학생총회는 다음 각호 중 하나에 따라 의장이 소집한다.","1. 학생대표자회의 소집요구","2. 학생대표자회의 재적 대의원 과반수의 연서에 따른 소집요구","3. 본회의 회원 50명 이상의 연서에 따른 소집요구","4. 제67조 제2항에 따른 학부 학생회장단 탄핵안 부의","② 학부운영위원회는 연서에 따른 소집요구가 있으면 제25조 제2항에 따라 연서를 심의하고, 결함이 없는 경우 지체 없이 학생총회 개의일을 결정한다. 이때 개의일은 소집요구 서식에 기재된 개의 희망일로 함을 원칙으로 하며, 변경하더라도 개의 희망일과 7일 이상의 차이가 있게 정할 수 없다.","③ 학생총회 의장은 제1항에도 불구하고 제23조 제2항에 따라 긴급한 사항으로 학부운영위원회의 의결을 거쳐 학생총회를 소집할 수 있다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":32,"sub":0,"add":false,"title":"소집공고","lines":["① 학생총회 의장은 학생총회의 소집을 개의일 5일 전까지 공고하여야 한다. 단, 제31조 제3항에 따른 소집은 그러하지 아니한다.","② 공고문에는 다음 각호의 사항을 명시하여야 한다.","1. 회의 시작 일시","2. 회의 장소","3. 안건 및 안건에 대한 설명"],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":33,"sub":0,"add":false,"title":"자료의 사전 배포","lines":["① 학생총회 의장은 학생총회 개의 5일 전까지 제출된 안건과 그에 관한 설명 등이 포함된 자료집을 회원들에게 배포하여야 한다.","② 자료집의 배포는 책자 형태로 제작하여 비치하는 방법 또는 전산화된 형태의 문서로 제작하여 온라인에 게시하는 방법으로 한다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":34,"sub":0,"add":false,"title":"개의ㆍ의결요건","lines":["① 학생총회는 본회의 회원 80명 이상의 출석으로 개의하고 출석 회원 과반수의 찬성으로 의결한다.","② 학부 학생회장단에 대한 탄핵안은 출석 회원 3분의 2 이상의 찬성으로 의결한다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":35,"sub":0,"add":false,"title":"표결방법","lines":["① 표결은 기명으로 함을 원칙으로 한다.","② 중요한 안건으로서 의장 또는 회원이 제의하여 학생총회가 의결하면 표결을 무기명으로 할 수 있다.","③ 학부 학생회장단에 대한 탄핵안은 반드시 무기명투표로 표결하여야 한다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":36,"sub":0,"add":false,"title":"안건","lines":["① 학생총회는 다음 각호의 안건을 심의ㆍ의결한다.","1. 학생대표자회가 소집요구와 함께 상정한 안건","2. 학생대표자회의 재적 대의원 과반수의 연서에 따른 소집요구와 함께 발의한 안건","3. 회원 50명 이상의 연서에 따른 소집요구와 함께 발의한 안건","4. 제67조 제2항에 따라 부의된 학부 학생회장단 탄핵안","② 학생총회는 본회를 폐지하는 의결을 할 수 없다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":37,"sub":0,"add":false,"title":"안건 위임","lines":["① 안건을 처리하지 못한 채로 회의의 산회가 결정되면 처리하지 못한 안건은 출석 회원 3분의 2 이상의 찬성으로 학생대표자회의에 위임할 수 있다.","② 학부 학생회장단 탄핵안은 위임할 수 없으며, 학생총회에 의하지 않고서는 출석 회원 3분의 2 이상의 찬성으로 학생총투표에서 처리할 수 있다.","③ 개의하지 못한 학생총회에 발의된 안건은 위임하지 아니하고 폐기한다."],"ch":"제2장 의결기구","sec":"제2절 학생총회"},{"no":38,"sub":0,"add":false,"title":"지위","lines":["① 학생총투표는 본회의 중대한 사항을 회원의 의사를 물어 결정하기 위한 투표이다.","② 학생총투표를 통한 의결은 학생총회의 의결과 같은 효력을 가진다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":39,"sub":0,"add":false,"title":"투표권","lines":["① 본회의 정회원은 학생총투표의 투표권을 가지며, 투표권자 총수에 포함된다.","② 제1항에도 불구하고 본회의 국제 회원은 투표권을 행사한 경우에만 투표권자 총수에 포함된다.","③ 본회의 준회원ㆍ수료회원은 투표권을 가지며, 투표권을 행사한 경우에만 투표권자 총수에 포함된다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":40,"sub":0,"add":false,"title":"시행","lines":["학생총투표는 다음 각호 중 하나에 따라 학생총회 의장이 시행한다.","1. 학생총회의 시행 결정","2. 학생대표자회의 시행 결정","3. 제67조 제2항에 따른 학부 학생회장단 탄핵안 부의"],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":41,"sub":0,"add":false,"title":"시행 공고","lines":["① 학생총회 의장은 학생총투표의 시행을 투표일 5일 전까지 공고하여야 한다.","② 공고문에는 다음 각호의 사항을 명시하여야 한다.","1. 학생총투표 시행 일시","2. 학생총투표 투표소 설치 장소","3. 안건 및 안건에 대한 설명"],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":42,"sub":0,"add":false,"title":"성립ㆍ의결요건","lines":["① 학생총투표는 제39조에 따라 결정된 투표권자 총수 4분의 1 이상의 투표로 성립하고, 유효투표의 과반수 찬성으로 의결한다.","② 성립 여부를 판단하기 위한 투표율의 계산은 명부상 총 투표자 수를 기준으로 한다. 단, 부정한 목적으로 명부를 부실하게 기재하였을 때는 그러하지 아니하다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":43,"sub":0,"add":false,"title":"투표관리위원회","lines":["① 투표관리위원회는 학생총투표와 관련된 모든 업무를 총괄한다.","② 그 밖의 투표관리위원회에 관한 자세한 사항은 제156조부터 제160조까지에 따른다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":44,"sub":0,"add":false,"title":"투표 기간","lines":["① 투표 기간은 3일의 범위에서 투표관리위원회가 정한다.","② 투표관리위원회는 투표 기간이 종료하였음에도 투표율이 제42조에 따른 성립 요건을 넘지 않았으면 투표 기간을 2일의 범위에서 1회 연장할 수 있다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":45,"sub":0,"add":false,"title":"투표 방법","lines":["① 투표는 기표 방법으로 함을 원칙으로 한다.","② 투표관리위원회는 회원들의 쉬운 투표 참여 혹은 부재중인 자의 투표 참여를 위하여 우편, 온라인, 모바일 그 밖의 특수한 투표 방법을 사용할 수 있다.","③ 투표관리위원회는 특수한 투표 방법의 시행 여부, 대상, 방식 및 운영 등에 관한 사항을 규칙으로 정한다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":46,"sub":0,"add":false,"title":"결과 공고","lines":["① 투표관리위원회는 학생총투표가 종료되어 개표가 완료되면 지체 없이 투표율과 개표 결과를 공고한다.","② 제1항에 따라 공고하는 최종 투표율은 총 투표용지 수를 기준으로 계산한다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":47,"sub":0,"add":false,"title":"무효 처리","lines":["① 한 투표소의 명부상 투표자 수와 투표함의 투표용지 수의 차이가 명부상 투표자 수 대비 3%를 넘으면 해당 투표함의 투표는 무효로 하며, 투표관리위원회는 해당 투표함의 투표용지를 모두 무효표로 처리한다. 단, 명부상 투표자 수가 100 이하일 때, 오차는 3까지 허용한다.","② 명부상 총 투표자 수와 총 투표용지 수의 차이가 명부상 총 투표자 수 대비 3%를 넘으면 해당 학생총투표는 무효가 된다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":48,"sub":0,"add":false,"title":"준용","lines":["그 밖의 학생총투표 관련 세부 사항은 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣의 투표ㆍ개표 관련 규정을 준용한다."],"ch":"제2장 의결기구","sec":"제3절 학생총투표"},{"no":49,"sub":0,"add":false,"title":"지위","lines":["학생대표자회는 본회와 본회 산하기구의 대표자를 대의원으로 하는 학생총회 다음의 의결기구이다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제1관 통칙"},{"no":50,"sub":0,"add":false,"title":"정기회의","lines":["① 학생대표자회 정기회의는 매 학기 1회 개의한다.","② 학생대표자회 정기회의는 각각 5월, 11월에 개의하는 것을 원칙으로 한다.","③ 학생대표자회 의장은 대의원과 협의하여 해당 학기 학생대표자회 정기회의 개의일을 확정 및 공고하여야 한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제1관 통칙"},{"no":51,"sub":0,"add":false,"title":"임시회의","lines":["① 학생대표자회 임시회의는 다음 각호 중 하나에 따라 의장이 소집한다.","1. 학부운영위원회의 소집요구","2. 학부운영위원회 재적 위원 과반수의 연서에 따른 소집요구","3. 학생대표자회 재적 대의원 3분의 1 이상의 연서에 따른 소집요구","4. 본회의 회원 30명 이상의 연서에 따른 소집요구","5. 제37조 제1항에 따른 학생총회의 안건 위임","6. 제108조 제1항에 따라 발의된 학생회장단 사퇴 허가 요청","7. 제109조에 따라 발의된 학부 학생회장단 탄핵안의 학생총회ㆍ학생총투표 부의","8. 제194조에 따른 회칙 개정안 발의","9. 제202조 제3항에 따른 세칙 제정안ㆍ개정안ㆍ폐지안 발의","② 학부운영위원회는 연서에 따른 소집요구가 있으면 제25조 제2항에 따라 연서를 심의하고, 결함이 없는 경우 지체 없이 학생대표자회 개의일을 결정한다. 이때 개의일은 소집요구 서식에 기재된 개의 희망일로 함을 원칙으로 하며, 변경하더라도 개의 희망일과 5일 이상의 차이가 있게 정할 수 없다.","③ 학생대표자회 의장은 제1항에도 불구하고 제23조 제2항에 따라 긴급한 사항으로 학생대표자회를 소집할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제1관 통칙"},{"no":52,"sub":0,"add":false,"title":"대의원","lines":["① 다음 각호에 해당하는 사람은 학생대표자회 대의원이 된다.","1. 학부 학생회장과 학부 부학생회장","2. 각 반 학생회의 학생회장, 부학생회장, 신입생 대표 1인 및 고학번 대표 1인","3. 각 자치단체장","② 선거 미시행 등의 이유로 대의원이 공석일 때는 사고로 하고 재적에서 제외한다. 이때 해당 기구는 발언권을 가지는 대표를 파견할 수 있다.","③ 제1항 제3호에 해당하는 사람이 학생대표자회에 정당한 사유로 출석하지 못할 때는 개의 직후 인준을 받아 해당 기구의 부 대표자가 대신 의결권을 가질 수 있다.","④ 특별기구장은 제59조와 제60조에 따른 소집공고 및 사전 배포된 자료집을 근거로 학생대표자회에 제출된 안건에 해당 특별기구와의 관련성이 있다고 판단하면 학생대표자회 개의 1일 전까지 학생대표자회 의장에게 대의원직을 신청할 수 있다. 해당 특별기구장의 대의원직 부여는 학생대표자회 개의 직후 출석 대의원 3분의 2 이상의 찬성으로 의결한다.","⑤ 제4항에 따라 부여된 대의원직은 해당 학생대표자회가 산회하면 소멸한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제2관 대의원"},{"no":53,"sub":0,"add":false,"title":"의무","lines":["① 대의원은 대의원으로서의 품위를 유지하여야 한다.","② 대의원은 회칙을 준수하여야 한다.","③ 대의원은 양심에 따라 직무를 행하고 회의에 성실히 참여하여야 한다.","④ 대의원은 자신이 소속된 기구의 의사를 충분히 수렴하여 의사 과정 전반에서 기구를 대표하는 의사를 표명하여야 한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제2관 대의원"},{"no":54,"sub":0,"add":false,"title":"결석","lines":["① 대의원이 사고로 인하여 학생대표자회에 출석하지 못하게 되거나 못한 경우 결석계를 의장에게 제출하여야 한다.","② 결석계의 제출은 학생대표자회 개의일로부터 3일 후까지 하는 것을 원칙으로 한다.","③ 결석계의 작성은 ｢고려대학교 총학생회 사무처리세칙｣에서 정한 서식을 준용한다.","④ 학부운영위원회는 결석의 사유를 참작하여 제출된 결석계를 심의하고 의결로 해당 결석을 인정한다.","⑤ 학부운영위원회는 결석계를 제출하지 않았거나 결석이 인정되지 않은 대의원의 경우, 대자보 등을 통하여 결석 사실을 공개할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제2관 대의원"},{"no":55,"sub":0,"add":false,"title":"특별위원회","lines":["① 학생대표자회는 특수한 목적을 달성하기 위하여 의결로 학생대표자회 대의원 중 일부를 구성원으로 하는 특별위원회를 둘 수 있다.","② 학생대표자회는 제1항에 따른 특별위원회를 구성할 때 다음 각호의 사항을 정하여야 한다. 단, 제3호의 경우 학생대표자회의 의결로 연장할 수 있다.","1. 소관 사항","2. 구성원","3. 활동기간","③ 특별위원회의 위원장은 위원 중 학생대표자회에서 임명한 자로 한다.","④ 학생대표자회는 다음 각호에 해당하면 출석 대의원 3분의 2 이상의 찬성으로 특별위원회의 활동을 종료시킬 수 있다.","1. 특별위원회의 활동 목적이 달성된 경우","2. 특별위원회의 활동 필요성이 없어진 경우","3. 특별위원회의 활동이 상당한 기간 진행되지 않은 경우","4. 그 밖의 특별위원회 활동을 종료시킬 만한 사유가 있는 경우","⑤ 특별위원회는 다음 각호에 해당하면 해산한다.","1. 활동기간이 종료된 경우","2. 제4항에 따라 활동이 종료된 경우","⑥ 특별위원회는 활동 목적의 달성에 관하여 필요한 경우 대의원이 아닌 본회의 회원 중에서 자문위원을 둘 수 있다. 단, 제56조와 제57조는 그러하지 아니한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제3관 특별위원회"},{"no":56,"sub":0,"add":false,"title":"감사위원회","lines":["① 학생대표자회는 본회 집행기구ㆍ산하기구ㆍ독립기구 및 특별기구의 사업 전반을 감사하기 위하여 감사위원회를 둘 수 있다.","② 감사위원회는 학생대표자회의 의결에 따라 감사 활동을 진행한 후 그 결과를 우선적으로 학부운영위원회에, 최종적으로 학생대표자회 정기회의에 보고하여야 한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제3관 특별위원회"},{"no":57,"sub":0,"add":false,"title":"징계위원회","lines":["① 학생대표자회는 다음 각호에 해당하는 대상이 회칙ㆍ세칙ㆍ규칙을 위반할 때 징계에 관한 사항을 심사하기 위하여 징계위원회를 둘 수 있다.","1. 집행위원","2. 학생대표자회 대의원","3. 산하기구","4. 독립기구","5. 특별기구","6. 제1호 및 제2호에 해당하지 않는 본회의 회원","② 징계위원회는 제1항 제1호, 제2호 및 제6호에 해당하는 대상의 징계에 관하여서는 학생대표자회의 의결과 동등한 효력을 갖는 의결을 할 수 있다.","③ 징계위원회는 징계에 관하여 심사한 후 그 결과를 학생대표자회에 보고하여야 한다. 단, 제1항 제1호, 제2호 및 제6호에 해당하는 대상의 징계에 관한 사항은 징계위원회의 의결로 보고하지 않을 수 있다.","④ 그 밖의 징계위원회에 관한 사항은 ｢고려대학교 자유전공학부 징계세칙｣으로 정한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제3관 특별위원회"},{"no":58,"sub":0,"add":false,"title":"활동","lines":["① 특별위원회는 활동 목적에 직ㆍ간접적으로 필요하다고 판단되면 학생대표자회의 출석 3분의 2 이상의 찬성으로 제55조 제2항 제1호의 소관 사항을 벗어난 활동을 할 수 있다.","② 특별위원회는 본회의 회원 및 각 기구에 출석 또는 자료 제출을 요청할 수 있다.","③ 특별위원회는 집행위원회에 협조를 요청할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제3관 특별위원회"},{"no":59,"sub":0,"add":false,"title":"소집공고","lines":["① 학생대표자회 의장은 학생대표자회의 소집을 개의일 3일 전까지 공고하여야 한다. 단, 제51조 제3항에 따른 소집은 그러하지 아니한다.","② 공고문에는 다음 각호의 사항을 명시하여야 한다.","1. 회의 시작 일시","2. 회의 장소","3. 안건 및 안건에 대한 설명"],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":60,"sub":0,"add":false,"title":"자료의 사전 배포","lines":["① 학생대표자회 의장은 학생대표자회 정기회의 개의 3일 전까지 다음 각호의 사항이 포함된 자료집을 회원들에게 배포하여야 한다.","1. 정기회의에 제출된 안건 및 그에 관한 설명","2. 집행위원회 등의 보고 및 인준 사항","3. 각 기구의 학생회비 예산안 및 결산","4. 그 밖의 정기회의에서 다루는 사항으로 사전 공고가 필요한 사항","② 자료집의 배포는 책자 형태로 제작하여 비치하는 방법 또는 전산화된 형태의 문서로 제작하여 온라인에 게시하는 방법으로 한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":61,"sub":0,"add":false,"title":"개의ㆍ의결요건","lines":["① 학생대표자회는 특별한 규정이 없는 한 재적 대의원 과반수 출석으로 개의하고 출석 대의원 과반수의 찬성으로 의결한다.","② 다음 각호의 사항은 재적 대의원 3분의 2 이상의 출석과 출석 대의원 3분의 2 이상의 찬성으로 의결한다.","1. 제67조 제2항의 학부 학생회장단 탄핵안의 학생총회ㆍ학생총투표 부의에 관한 사항","2. 제74조 제1항의 회칙 개정에 관한 사항","③ 다음 각호의 사항은 재적 대의원 과반수 출석과 출석 대의원 3분의 2 이상의 찬성으로 의결한다.","1. 제68조 제2항의 집행위원 해임에 관한 사항","2. 제72조 제1항의 징계에 관한 사항","3. 제73조 제3항의 학부 학생회비 인상ㆍ인하에 관한 사항","4. 제74조 제2항의 세칙의 제정ㆍ개정ㆍ폐지에 관한 사항"],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":62,"sub":0,"add":false,"title":"표결방법","lines":["① 표결은 기명으로 함을 원칙으로 한다.","② 의장 또는 대의원이 제의하여 학생대표자회가 의결하면 표결을 전자투표에 의한 기록표결을 시행할 수 있다.","③ 중요한 안건으로서 의장 또는 대의원이 제의하여 학생대표자회가 의결하면 표결을 무기명으로 할 수 있다.","④ 다음 각호의 사항을 의결할 때는 반드시 기명투표로 표결하여야 한다.","1. 제74조 제1항의 회칙 개정에 관한 사항","2. 제74조 제2항의 세칙 제정ㆍ개정ㆍ폐지에 관한 사항","⑤ 다음 각호의 사항을 의결할 때는 반드시 무기명투표로 표결하여야 한다.","1. 제67조 제2항의 학부 학생회장단 탄핵안에 관한 사항","2. 제68조 제2항의 집행위원 해임에 관한 사항","3. 제72조 제1항의 징계에 관한 사항","4. 제73조 제2항의 학부 학생회비 지급에 관한 사항","⑥ 의장은 안건에 대한 이의가 있는지 물어서 이의가 없다고 인정하면 가결되었음을 선포할 수 있다. 단, 이의가 있을 때 또는 무기명으로 표결할 때는 반드시 표결하여야 한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":63,"sub":0,"add":false,"title":"안건","lines":["학생대표자회는 다음 각호의 안건을 심의ㆍ의결한다.","1. 학부운영위원회가 상정한 안건","2. 학부운영위원회 재적 위원 과반수의 연서에 따른 소집요구와 함께 발의한 안건","3. 학생대표자회 재적 대의원 3분의 1 이상의 연서에 따른 소집요구와 함께 발의한 안건","4. 본회의 회원 30명 이상의 연서에 따라 발의된 안건","5. 제37조 제1항에 따라 학생총회에서 위임된 안건","6. 제108조 제1항에 따라 발의된 학부 학생회장단 사퇴 허가 안건","7. 제109조에 따라 발의된 학부 학생회장단 탄핵안의 학생총회ㆍ학생총투표 부의에 관한 안건","8. 제194조에 따라 발의된 회칙 개정안","9. 제202조 제3항에 따라 발의된 세칙 제정안ㆍ개정안ㆍ폐지안"],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":64,"sub":0,"add":false,"title":"안건 위임","lines":["① 안건을 처리하지 못한 채로 회의의 산회가 결정되면 처리하지 못한 안건은 출석 대의원 3분의 2 이상의 찬성으로 학부운영위원회에 위임할 수 있다.","② 다음 각호의 안건은 위임할 수 없다.","1. 제67조 제2항의 학부 학생회장단 탄핵안에 관한 사항","2. 제68조 제2항의 집행위원 해임에 관한 사항","3. 제72조 제1항의 징계에 관한 사항","4. 제73조 제3항의 학부 학생회비의 인상ㆍ인하에 관한 사항","5. 제74조 제1항의 회칙 개정에 관한 사항","6. 제74조 제2항의 세칙 제정ㆍ개정ㆍ폐지에 관한 사항","7. 그 밖의 본회의 목적에 관련된 본질적으로 중대한 결정 사항","③ 개의하지 못한 학생대표자회에 발의된 안건은 위임하지 아니하고 폐기한다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제4관 회의"},{"no":65,"sub":0,"add":false,"title":"학생총회ㆍ학생총투표에 관한 사항","lines":["① 학생대표자회는 제31조 제1항에 따라 학생총회의 소집을 요구할 수 있으며, 제36조 제1항에 따라 학생총회에 안건을 상정할 수 있다.","② 학생대표자회는 제40조에 따라 학생총투표 시행을 결정할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":66,"sub":0,"add":false,"title":"결정ㆍ집행 사항 변경에 관한 사항","lines":["① 학생대표자회는 학부운영위원회, 학부 학생회장단과 집행위원회의 결정ㆍ집행 사항을 변경 또는 취소할 수 있다.","② 학생대표자회는 반 운영위원회, 반 학생회장단과 반 집행위원회의 결정ㆍ집행 사항을 변경 또는 취소할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":67,"sub":0,"add":false,"title":"학부 학생회장단 사퇴ㆍ탄핵에 관한 사항","lines":["① 학생대표자회는 학부 학생회장 또는 학부 부학생회장이 제108조 제1항에 따라 사퇴의 허가를 요청하면 허가 여부를 심의ㆍ의결한다.","② 학생대표자회는 제109조에 따라 학부 학생회장단에 대한 탄핵안이 상정되면 탄핵안의 학생총회ㆍ학생총투표 부의를 의결할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":68,"sub":0,"add":false,"title":"집행위원회에 관한 사항","lines":["① 학생대표자회는 집행위원회의 다음 각호의 사항에 관하여 보고받고 이를 인준한다. 단, 학부운영위원회의 사전 인준이 있으면 학생대표자회 정기회의 개의 전까지 해당 결정은 효력을 지닌다.","1. 사업 계획과 정책의 기본 방향","2. 집행위원장과 집행위원의 임명","3. 산하 국서의 신설ㆍ폐지와 변경","② 학생대표자회는 집행위원장과 집행위원 또는 이에 준하는 자를 해임할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":69,"sub":0,"add":false,"title":"자치단체에 관한 사항","lines":["① 학생대표자회는 자치단체를 등록 및 인준할 수 있다.","② 학생대표자회는 자치단체의 탈퇴를 승인할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":70,"sub":0,"add":false,"title":"특별기구에 관한 사항","lines":["① 학생대표자회는 학생자치의 특수한 영역과 기능을 담당하는 특별기구를 인준할 수 있다.","② 학생대표자회는 특별기구의 해산을 승인할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":71,"sub":0,"add":false,"title":"감사에 관한 사항","lines":["① 학생대표자회는 본회 집행기구, 산하기구, 독립기구 및 특별기구의 사업 전반에 대하여 감사를 시행할 수 있다.","② 학생대표자회는 감사에 필요하다고 인정될 때 해당 기구의 대표자 또는 사업담당자를 출석시켜 진술을 청취하거나 관련 자료의 제출을 요구할 수 있다.","③ 학생대표자회는 제1항의 감사를 위하여 제56조의 감사위원회를 설치할 수 있다.","④ 제1항에도 불구하고 학생대표자회는 독립기구의 사업이 진행되고 있는 동안에는 해당 독립기구에 대하여 감사를 시행할 수 없다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":72,"sub":0,"add":false,"title":"징계에 관한 사항","lines":["① 학생대표자회는 회원, 집행위원장과 집행위원, 학생대표자회 대의원, 산하기구, 독립기구 및 특별기구가 본 회칙ㆍ세칙ㆍ규칙을 위반할 때 징계할 수 있다.","② 학생대표자회는 제1항의 징계를 위하여 제57조의 징계위원회를 설치할 수 있다.","③ 제1항에도 불구하고 학생대표자회는 독립기구의 사업이 진행되고 있는 동안에는 해당 독립기구에 대하여 징계할 수 없다.","④ 그 밖에 징계에 대한 자세한 사항은 ｢고려대학교 자유전공학부 징계세칙｣을 따른다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":73,"sub":0,"add":false,"title":"재정에 관한 사항","lines":["① 학생대표자회는 학부운영위원회의 심의를 거친 집행위원회, 반 학생회, 특별기구 및 그 밖의 학부 학생회비를 사용하는 기구의 예산안ㆍ결산을 심의하여 승인한다.","② 학생대표자회는 제1항의 심의에서 승인되지 않은 기구에는 제190조에 따라 해당 학기의 학부 학생회비를 지급하지 않거나 지급액을 삭감 또는 지급을 보류하도록 결정할 수 있다.","③ 학생대표자회는 학부 학생회비의 인상ㆍ인하를 결정할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":74,"sub":0,"add":false,"title":"회칙ㆍ세칙ㆍ규칙에 관한 사항","lines":["① 학생대표자회는 회칙을 개정할 수 있다.","② 학생대표자회는 세칙을 제정ㆍ개정ㆍ폐지할 수 있다.","③ 학생대표자회는 규칙ㆍ자치규칙이 회칙ㆍ세칙에 부합하는지 심사할 수 있으며, 부합하지 않다고 의결하면 해당 규칙ㆍ자치규칙은 즉시 효력을 잃는다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":75,"sub":0,"add":false,"title":"대외활동에 관한 사항","lines":["① 학생대표자회는 본회 차원의 상설적 연대 단체 가입ㆍ탈퇴에 대한 동의권을 가진다.","② 학생대표자회는 회원 전체의 명의로 소송을 진행할 필요가 있는 문제가 발생할 때 학부운영위원회에 소송권을 위임할 수 있다."],"ch":"제2장 의결기구","sec":"제4절 학생대표자회 · 제5관 권한"},{"no":76,"sub":0,"add":false,"title":"지위","lines":["학부운영위원회는 본회의 신속하고 민주적인 결정을 위하여 학생대표자회가 일정 권한을 위임한 상설적인 의결기구이다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제1관 통칙"},{"no":77,"sub":0,"add":false,"title":"정기회의","lines":["① 학부운영위원회 정기회의는 매주 1회 개의함을 원칙으로 한다. 단, 학부운영위원회는 의결로 정기회의의 일정을 조정할 수 있다.","② 학부 학생회장은 임기 시작 직후 학부운영위원회 정기회의 개의 요일과 시각을 학부운영위원들과 협의하여 결정한 후 이를 공고하여야 한다.","③ 학부운영위원회 의장은 매월 말 익월의 학부운영위원회 정기회의 일정을 학부운영위원들과 협의하여 결정하여야 한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제1관 통칙"},{"no":78,"sub":0,"add":false,"title":"임시회의","lines":["① 학부운영위원회 임시회의는 다음 각호 중 하나에 따라 의장이 소집한다.","1. 의장의 소집요구","2. 학부운영위원회 재적 위원 3분의 1 이상의 연서에 따른 소집요구","3. 본회의 회원 20명 이상의 연서에 따른 소집요구","② 학부운영위원회는 연서에 따른 소집요구가 있으면 제25조 제2항에 따라 연서를 심의하고, 결함이 없는 경우 지체 없이 학부운영위원회 개의일을 결정한다. 이때 개의일은 소집요구 서식에 기재된 개의 희망일로 함을 원칙으로 하며, 변경하더라도 개의 희망일과 3일 이상의 차이가 있게 정할 수 없다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제1관 통칙"},{"no":79,"sub":0,"add":false,"title":"학부운영위원","lines":["① 다음 각호 중 하나에 해당하는 자는 학부운영위원이 된다.","1. 학부 학생회장과 학부 부학생회장","2. 각 반 학생회장","② 선거 미시행 등의 이유로 위원이 공석일 때는 사고로 하고 재적에서 제외한다. 이때 반 학생회는 발언권을 가지는 대표를 파견할 수 있다.","③ 제1항 제2호의 학부운영위원이 학부운영위원회에 정당한 사유로 출석하지 못할 때는 개의 직후 인준을 받아 해당 기구의 부학생회장이 대신 의결권을 가질 수 있다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제2관 위원"},{"no":80,"sub":0,"add":false,"title":"학부운영위원의 의무","lines":["학부운영위원의 의무에 관하여서는 제53조를 준용한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제2관 위원"},{"no":81,"sub":0,"add":false,"title":"특별위원회","lines":["① 학부운영위원회는 특수한 목적을 달성하기 위하여 의결로 특별위원회를 둘 수 있다.","② 학부운영위원회는 제1항에 따른 특별위원회를 구성할 때 구체적인 소관 사항을 정하여야 한다.","③ 본회의 회원은 특별위원회의 위원이 될 수 있다.","④ 특별위원회는 본회의 회원을 대상으로 위원을 공개적으로 모집할 수 있다. 단, 특별위원회의 위원장이 선출되지 않았으면 학부운영위원회 의장이 대신 모집할 수 있다.","⑤ 특별위원회의 위원장은 특별위원회 내부에서 선출한다.","⑥ 특별위원회는 학부운영위원회의 인준으로 업무를 개시하며, 그 구성원의 변동이 있을 때는 지체 없이 학부운영위원회에 보고하여야 한다.","⑦ 특별위원회는 학부운영위원회에 활동 내용을 수시로 보고하여야 한다.","⑧ 특별위원회의 활동기간은 제5항에 따라 처음으로 인준된 후 첫 번째 2학기 종강일까지로 한다. 단, 특별위원회는 수행하던 업무가 종료되지 아니하였다고 판단할 때는 활동 종료일 후 30일 이내에 학부운영위원회에 재인준을 요청할 수 있다.","⑨ 학부운영위원회는 다음 각호에 해당하면 출석 위원 3분의 2 이상의 찬성으로 특별위원회의 활동을 종료시킬 수 있다.","1. 특별위원회의 활동 목적이 달성된 경우","2. 특별위원회의 활동 필요성이 없어진 경우","3. 특별위원회의 활동이 상당한 기간 진행되지 않은 경우","4. 그 밖의 특별위원회 활동을 종료시킬 만한 사유가 있는 경우","⑩ 특별위원회는 다음 각호에 해당하면 해산한다.","1. 활동기간이 종료된 경우","2. 제9항에 따라 활동이 종료된 경우"],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제3관 특별위원회"},{"no":82,"sub":0,"add":false,"title":"인권침해사건대책위원회","lines":["① 학부운영위원회는 본회의 회원에 대한 인권침해사건이 발생할 때는 해당 사건을 조사하기 위하여 인권침해사건대책위원회를 둘 수 있다.","② 인권침해사건대책위원회의 구성ㆍ업무ㆍ권한 및 운영에 관하여 필요한 사항은 의결로 ｢고려대학교 총학생회 인권침해사건대응세칙｣을 준용한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제3관 특별위원회"},{"no":83,"sub":0,"add":false,"title":"활동","lines":["① 특별위원회는 활동 목적에 직ㆍ간접적으로 필요하다고 판단되면 학부운영위원회의 출석 3분의 2 이상의 찬성으로 제81조 제2항에서 정한 소관 사항을 벗어난 활동을 할 수 있다.","② 특별위원회는 본회의 회원 및 각 기구에 출석 또는 자료 제출을 요청할 수 있다.","③ 특별위원회는 집행위원회에 협조를 요청할 수 있다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제3관 특별위원회"},{"no":84,"sub":0,"add":false,"title":"소집 공고","lines":["① 학부운영위원회 의장은 학부운영위원회 정기회의의 소집을 개의일 1일 전까지 공고하여야 한다.","② 공고문에는 다음 각호의 사항을 명시하여야 한다.","1. 회의 시작 일시","2. 회의 장소","3. 안건과 안건에 대한 설명"],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제4관 회의"},{"no":85,"sub":0,"add":false,"title":"안건지의 사전 배포","lines":["① 학부운영위원회 의장은 학부운영위원회 정기회의 개의 1일 전까지 제출된 안건과 그에 관한 설명, 집행위원회 등의 보고ㆍ인준 사항 등이 포함된 안건지를 회원들에게 배포하여야 한다.","② 안건지의 배포는 유인물 형태로 제작하여 비치하는 방법 또는 전산화된 형태의 문서로 제작하여 온라인에 게시하는 방법으로 한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제4관 회의"},{"no":86,"sub":0,"add":false,"title":"개의ㆍ의결요건","lines":["학부운영위원회는 특별한 규정이 없는 한 재적 위원 과반수의 출석으로 개의하고 출석 위원 과반수의 찬성으로 의결한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제4관 회의"},{"no":87,"sub":0,"add":false,"title":"표결방법","lines":["① 표결은 기명으로 함을 원칙으로 한다.","② 중요한 안건으로서 의장 또는 위원이 제의하여 학부운영위원회가 의결하면 표결을 무기명으로 할 수 있다.","③ 제96조 제4항의 규칙 제정ㆍ개정ㆍ폐지에 관한 사항은 반드시 기명투표로 표결하여야 한다.","④ 학부운영위원회 의장은 안건에 대한 이의가 있는지 물어서 이의가 없다고 인정하면 가결되었음을 선포할 수 있다. 단, 이의가 있을 때 또는 무기명으로 표결할 때는 반드시 표결하여야 한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제4관 회의"},{"no":88,"sub":0,"add":false,"title":"안건","lines":["① 학부운영위원회는 다음 각호의 안건을 심의ㆍ의결한다.","1. 학부운영위원이 발의한 안건","2. 집행위원회가 발의한 안건","3. 본회의 회원 20명 이상의 연서에 따른 소집요구와 함께 발의한 안건","4. 제64조 제1항에 따라 학생대표자회에서 위임된 안건","② 세칙에서 해당 세칙에 부수되는 규칙의 제정ㆍ개정ㆍ폐지에 관한 권한을 학부운영위원회에 위임할 때는 제1항에도 불구하고 해당 규칙의 제정안ㆍ개정안ㆍ폐지안 발의에 관하여서는 해당 세칙의 규정에 따른다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제4관 회의"},{"no":89,"sub":0,"add":false,"title":"의결기구에 관한 사항","lines":["① 학부운영위원회는 제51조 제1항에 따라 학생대표자회의 소집을 요구할 수 있으며 제63조에 따라 학생대표자회에 안건을 발의할 수 있다.","② 학부운영위원회는 학생총회 또는 학생대표자회 개의에 관한 세부 문제를 논의하고 결정한다.","③ 학부운영위원회는 학생총회 또는 학생대표자회에 대하여 연서에 따른 소집요구가 있으면 제31조 제2항 및 제51조 제2항에 따라 학생총회 또는 학생대표자회의 개의일을 결정한다.","④ 학부운영위원회는 학생대표자회 개의 전 학생대표자회 대의원이 민주적 선거에 따라 당선되었는지 실질적으로 기구를 대표하고 있는지 등 대표자 지위에 대한 심사를 진행하여야 하며, 이를 기준으로 대의원 명단을 확정한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":90,"sub":0,"add":false,"title":"학부 학생회장단의 탄핵에 관한 사항","lines":["학부운영위원회는 학부 학생회장단에 대한 탄핵안이 발의되면 제109조 제4항에 따라 학생대표자회를 소집한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":91,"sub":0,"add":false,"title":"집행기구에 관한 사항","lines":["① 학부운영위원회는 제119조 제3항, 제120조 제3항에 따라 집행위원장과 집행위원회 국서별 국장과 국원을 사전 인준한다.","② 학부운영위원회는 제68조 제1항에 따라 학생총회 또는 학생대표자회 보고 사항을 사전 심의ㆍ의결한다.","③ 학부운영위원회는 학부 학생회장단과 집행위원회의 사업 계획과 진행 상황, 결과에 대한 보고를 받고 이를 심의하고 조정한다.","④ 학부운영위원회는 학부 학생회장단과 집행위원회의 효율적인 집행을 보장하기 위하여 학부 학생회장단이 사전 집행이 불가피하다고 판단하여 집행한 사업의 승인권을 가진다.","⑤ 학부운영위원회는 학부 학생회장단과 집행위원회의 결정과 집행 사항을 변경 또는 취소할 수 있다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":92,"sub":0,"add":false,"title":"자치단체에 관한 사항","lines":["학부운영위원회는 자치단체 등록 신청을 심의하여 학생대표자회에 해당 단체의 자치단체 등록에 관한 안건을 상정한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":93,"sub":0,"add":false,"title":"특별기구에 관한 사항","lines":["① 학부운영위원회는 특별기구 인준 신청을 심의하여 학생대표자회에 해당 단체의 특별기구 인준에 관한 안건을 상정한다.","② 학부운영위원회는 특별기구 재인준 신청을 심의하여 학생대표자회에 특별기구 재인준에 관한 안건을 상정한다.","③ 학부운영위원회는 필요한 경우 특별기구의 장 또는 특정 업무 담당자의 출석을 요구할 수 있다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":94,"sub":0,"add":false,"title":"선거에 관한 사항","lines":["① 학부운영위원회는 학부 학생회장단 선거 일정을 결정한다.","② 학부운영위원회는 동시선거 일정을 결정한다.","③ 학부운영위원회는 제152조 제1항에 따라 선거관리위원회가 구성되면 지체 없이 각 선거관리위원의 자격 등을 심사한다.","④ 그 밖의 자세한 사항은 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣을 따른다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":95,"sub":0,"add":false,"title":"재정에 관한 사항","lines":["① 학부운영위원회는 제184조에 따라 집행기구 자산의 취득, 사용, 보관 및 처분 행위를 변경 또는 취소할 수 있다.","② 학부운영위원회는 제188조에 따라 집행위원회, 반 학생회, 특별기구 및 그 밖의 학부 학생회비를 사용하는 기구의 예산안 및 결산을 사전 심의한 후 학생대표자회에 상정한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":96,"sub":0,"add":false,"title":"회칙ㆍ세칙ㆍ규칙에 관한 사항","lines":["① 학부운영위원회는 제194조에 따라 회칙 개정안을 발의할 수 있다.","② 학부운영위원회는 제202조 제3항에 따라 세칙 제정안ㆍ개정안 및 폐지안을 발의할 수 있다.","③ 학부운영위원회는 세칙에 따라 그 세칙에 부수되는 규칙을 제정ㆍ개정 및 폐지할 수 있다.","④ 학부운영위원회는 일반규칙ㆍ임시규칙을 제정ㆍ개정 및 폐지할 수 있다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":97,"sub":0,"add":false,"title":"대외활동에 관한 사항","lines":["① 학부운영위원회는 본회 차원의 대외적 활동에 대한 동의권을 갖는다.","② 학부운영위원회는 직전 학기로부터 당해 학기로 이월된 학부 학생회비의 5%를 초과하는 재정적 지출을 수반하거나, 본회의 회원에게 중대한 영향을 미치는 학부 학생회장단 또는 집행위원회 차원의 대외활동에 대하여 동의권을 갖는다.","③ 제1항과 제2항의 사항에 관하여 학부운영위원회는 학부 학생회장단과 집행위원회의 효율적인 대외활동을 보장하기 위하여 학부 학생회장이 사전 집행이 불가피하다고 판단하여 집행한 대외활동의 승인권을 가진다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":98,"sub":0,"add":false,"title":"학교 운영 참여에 관한 사항","lines":["학부운영위원회는 본회를 대표하여 학교 기구의 학생 대표가 되는 자를 회의에 배석하도록 하여 그 기구에서의 논의 사항을 보고받고, 의결권의 행사에 관하여 회원의 의사가 반영되도록 할 수 있는 방안을 논의한다."],"ch":"제2장 의결기구","sec":"제5절 학부운영위원회 · 제5관 권한"},{"no":99,"sub":0,"add":false,"title":"지위","lines":["비상대책위원회는 학부운영위원회를 대신하여 임시로 구성되는 의결기구이다."],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":100,"sub":0,"add":false,"title":"구성","lines":["비상대책위원회는 다음 각호 중 어느 하나에 해당하면 구성된다. 단, 제1호에 해당할 때 학부 학생회장단 임기가 끝나지 않았다면 그 임기가 끝난 시점부터 구성된다.","1. 학부 학생회장단 선거가 무산될 때","2. 학부 학생회장단 전원이 사퇴하고, 해당 학부 학생회장단의 잔여 임기가 180일이 넘지 않을 때","3. 학부 학생회장단 전원이 탄핵되고, 해당 학부 학생회장단의 잔여 임기가 180일이 넘지 않을 때","4. 학부 학생회장단 전원이 당연퇴직하고, 해당 학부 학생회장단의 잔여 임기가 180일이 넘지 않을 때"],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":101,"sub":0,"add":false,"title":"비상대책위원","lines":["① 각 반 학생회장과 부학생회장은 비상대책위원이 된다.","② 학생대표자회는 제1항을 제외한 학생대표자회 대의원 중 비상대책위원을 호선할 수 있다.","③ 제2항에 따라 비상대책위원이 된 자가 더 이상 학생대표자회 대의원이 아니게 된 경우 그다음으로 해당 대의원직을 가지게 된 자에게는 제2항에 따른 호선의 효력이 인정되지 아니한다."],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":102,"sub":0,"add":false,"title":"위원장","lines":["① 비상대책위원장은 학부 학생회장단의 궐위 동안 학부 학생회장에 준하는 권한을 가지며, 학부 학생회장단의 상시적 업무를 담당한다.","② 비상대책위원장은 위원들이 제101조 제1항에 따라 위원이 된 자 중에서 선출한다.","③ 비상대책위원장은 비상대책위원회의 선출로 업무를 개시하며 선출 직후 지체 없이 학생대표자회의 인준을 받아야 한다.","④ 비상대책위원장의 임기는 비상대책위원회에서 선출된 시점부터 다음 학부 학생회장단 선거에 따른 학부 학생회장단 당선인의 임기 개시 예정일까지로 한다. 단, 제174조 제2항에 따른 재선거가 무산될 때는 학생대표자회의 의결로 그 해 2학기 종강일까지 임기를 연장할 수 있다.","⑤ 비상대책위원장이 다음 각호 중 어느 하나에 해당하면 그 시점부터 임기를 마친 것으로 본다.","1. 당연퇴직한 경우","2. 제101조 제1항 또는 학생대표자회 대의원의 임기가 만료된 경우","⑥ 비상대책위원장은 비상대책위원회의 허가를 받아 사퇴할 수 있다. 이때 비상대책위원회는 지체 없이 다음 비상대책위원장을 선출한다.","⑦ 비상대책위원장은 중임할 수 없다.","⑧ 비상대책위원장의 의무에 관하여서는 제107조를 준용한다."],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":103,"sub":0,"add":false,"title":"권한ㆍ업무","lines":["① 비상대책위원회는 학부운영위원회에 준하는 권한을 가지며, 특별한 사유가 없으면 회칙ㆍ세칙ㆍ규칙의 “학부운영위원회”와 “학부운영위원”을 “비상대책위원회”와 “비상대책위원”으로 본다.","② 비상대책위원회는 학부 학생회장단의 궐위 기간 학부운영위원회의 상시적 업무를 담당한다.","③ 비상대책위원회는 학부 학생회장단의 궐위 기간 집행위원회의 상시적 업무를 담당하기 위하여 임시 집행위원회를 구성할 수 있다."],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":104,"sub":0,"add":false,"title":"제한","lines":["① 비상대책위원장은 학부 학생회장이 가지는 사전 집행ㆍ사후 학부운영위원회 승인 방식의 사업 집행 및 대외활동을 할 수 없다.","② 임시집행위원회는 집행위원회가 가지는 사전 집행ㆍ사후 학부운영위원회 승인 방식의 사업 집행 및 대외활동을 할 수 없다.","③ 비상대책위원장과 임시집행위원회는 직전 학기로부터 당해 학기로 이월된 학부 학생회비의 30%를 초과하는 재정지출을 할 수 없다.","④ 제3항의 경우 제186조 제2항 및 제186조 제3항에 따른 재정지출은 포함하지 아니한다."],"ch":"제2장 의결기구","sec":"제6절 비상대책위원회"},{"no":105,"sub":0,"add":false,"title":"학부 학생회장단","lines":["① 학부 학생회장은 본회를 대표하며, 본회 의결기구의 의장이 된다.","② 학부 부학생회장은 학부 학생회장을 보좌하고, 학부 학생회장이 권한을 위임하거나 사고일 때에 학부 학생회장의 직무를 대행한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":106,"sub":0,"add":false,"title":"임기ㆍ삼선 금지","lines":["① 학부 학생회장단의 임기는 특별한 규정이 없는 한 당선된 해의 2학기 종강일 다음 날부터 이듬해 2학기 종강일까지로 한다.","② 학부 학생회장단이 제174조 제2항에 따른 재선거 및 제175조의 보궐선거를 통하여 당선되었으면 해당 학부 학생회장단의 임기는 당선 확정이 공고된 시점부터 그 해 2학기 종강일까지로 한다.","③ 학부 학생회장단이 제174조 제3항에 따른 재선거를 통하여 당선되었으면 해당 학부 학생회장단의 임기는 당선 확정이 공고된 시점부터 이듬해 2학기 종강일까지로 한다.","④ 학부 학생회장 또는 학부 부학생회장은 후임 학부 학생회장단 선거에서 학부 학생회장 또는 학부 부학생회장 후보로 입후보할 수 있다. 단 이미 학부 학생회장단을 중임하였을 때는 그러하지 아니한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":107,"sub":0,"add":false,"title":"의무","lines":["① 학부 학생회장단은 회원들의 의사를 반영하여 민주적 절차에 따라 업무를 수행하여야 한다.","② 학부 학생회장은 본회의 대표로서 본회의 의결기구에 본회의 활동 사항을 보고하여야 한다.","③ 학부 학생회장단은 본회의 지속적ㆍ장기적 발전을 위하여 노력하여야 한다.","④ 학부 학생회장단은 본회와 본회 산하기구 및 특별기구에서 치러지는 각종 선거에서 부당한 영향력의 행사 등 선거 결과에 직ㆍ간접적인 영향을 미치는 행위를 하여서는 아니 된다.","⑤ 학부 학생회장단은 후임 학부 학생회장단의 선출과 후임 학부 학생회장단으로의 인수인계가 원활하게 이루어질 수 있도록 노력하여야 한다.","⑥ 학부 학생회장은 본회의 대표로 학교 기구의 위원이 될 때는 제98조에 따라 의결권 행사 등에 관하여 학부운영위원회와 협의하여야 한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":108,"sub":0,"add":false,"title":"사퇴","lines":["① 학부 학생회장 또는 학부 부학생회장이 사퇴하고자 할 때는 학생대표자회의 허가가 있어야 한다. 단, 사망 등으로 인하여 당사자가 허가를 받을 수 없을 때는 그러하지 아니한다.","② 학부 학생회장이 사퇴하면 학부 부학생회장이 그 직을 승계한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":109,"sub":0,"add":false,"title":"탄핵","lines":["① 학부 학생회장단이 업무 수행에 있어서 회칙을 중대하게 위반하였을 때 다음 각호 중 하나에 따라 학부 학생회장단의 탄핵안을 발의할 수 있다.","1. 학부운영위원회의 재적 위원 3분의 2 이상에 해당하는 연서","2. 학생대표자회의 재적 위원 과반수에 해당하는 연서","3. 본회의 회원 50명 이상에 해당하는 연서","② 학부 학생회장단에 대한 탄핵안은 학부 학생회장과 학부 부학생회장 전원을 대상으로 발의할 수도 있고, 한 명만을 대상으로 발의할 수도 있다.","③ 탄핵안이 발의되면 학부운영위원회 의장은 지체 없이 학부운영위원회를 소집하여 제1항의 연서에서 형식상의 결함을 심의한다. 단, 학부운영위원회 의장이 회의 소집을 거부하였을 때는 학부운영위원회 재적 위원 3분의 1의 연서에 따라 학부운영위원이 직접 회의를 소집할 수 있으며, 개의 직후 임시의장을 선출한다.","④ 제3항에 따라 심의한 연서에 중대한 하자가 없는 경우 학부운영위원회는 탄핵안 발의 10일 이내에 학생대표자회를 소집한다.","⑤ 학생대표자회는 제61조 제2항에 따라 탄핵안의 학생총회ㆍ학생총투표 부의를 의결한다.","⑥ 제5항에 따라 부의가 의결되는 경우 학생대표자회는 학생총회 소집과 학생총투표 시행 중 탄핵안을 처리할 방식을 의결한다.","⑦ 학부 학생회장단에 대한 탄핵안은 학생총회이면 제34조 제2항, 학생총투표이면 제42조 제1항에 따라 의결한다.","⑧ 제7항에 따라 탄핵이 의결되면 탄핵의 대상이 된 학부 학생회장단의 일부 또는 전원은 그 의결된 시점부터 해당 직을 잃는다.","⑨ 학부 학생회장만이 탄핵되면 학부 부학생회장이 그 직을 승계한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":110,"sub":0,"add":false,"title":"당연퇴직","lines":["학부 학생회장이 당연퇴직하면 학부 부학생회장이 그 직을 승계한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":111,"sub":0,"add":false,"title":"직무정지","lines":["① 제109조 제5항에 따라 학생대표자회에서 탄핵안의 부의가 의결된 시점으로부터 그 대상은 모든 직무가 정지되며, 제108조에 따른 사퇴를 할 수 없다.","② 제1항의 직무 정지는 학생총회ㆍ학생총투표에서 탄핵안이 부결된 시점부터 해제된다.","③ 학부 학생회장단 중 일부 또는 전원이 다음 학부 학생회장단 선거에 후보로 등록하여 후보 등록 공고가 된 시점으로부터 그 대상은 모든 직무가 정지된다.","④ 제3항의 직무 정지는 해당 학부 학생회장단 선거가 종료된 시점부터 해제된다.","⑤ 학부 학생회장만이 직무가 정지될 때는 학부 부학생회장이 그 직을 대행한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":112,"sub":0,"add":false,"title":"학부 학생회장단 권한대행","lines":["① 학부 학생회장단 권한대행은 다음 각호 중 하나에 해당할 때 그 사항의 공고 직후 구성된다.","1. 학부 학생회장단 전원이 제111조의 직무정지 상태일 때","2. 학부 학생회장단 전원이 사퇴하고, 해당 학부 학생회장단의 잔여 임기가 180일을 초과할 때","3. 학부 학생회장단 전원이 탄핵되고, 해당 학부 학생회장단의 잔여 임기가 180일을 초과할 때","4. 학부 학생회장단 전원이 당연퇴직하고, 해당 학부 학생회장단의 잔여 임기가 180일 초과할 때","② 학부 학생회장단 권한대행은 학부운영위원들이 그 위원 중에서 선출한다.","③ 학부 학생회장단 권한대행은 학부 학생회장단에 준하는 권한과 의무를 지닌다. 단, 제114조 제3항 및 제5항에 따른 권한의 행사에 관하여서는 학부운영위원회의 동의를 받아야 한다.","④ 제1항 제1호에 따른 학부 학생회장단 권한대행의 임기는 학부 학생회장단의 직무 정지가 해제되는 시점까지로 한다. 다만, 학부 학생회장단의 임기가 직무 정지 중에 종료될 때는 권한대행의 임기도 그 시점으로부터 종료된 것으로 본다.","⑤ 제1항 제2호부터 제4호까지에 따른 학부 학생회장단 권한대행의 임기는 후임 학부 학생회장단 보궐선거가 종료되는 시점까지로 한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제1관 지위"},{"no":113,"sub":0,"add":false,"title":"의결기구에 관한 사항","lines":["학부 학생회장은 의장으로서 학생총회, 학생대표자회, 학부운영위원회를 운영한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제2관 권한"},{"no":114,"sub":0,"add":false,"title":"집행기구에 관한 사항","lines":["① 학부 학생회장은 본회의 사무 집행을 총괄한다.","② 학부 학생회장은 집행위원회의 구성권을 가진다.","③ 학부 학생회장은 집행위원장과 집행위원회 산하 국서의 국장과 국원에 대한 임면권을 가진다.","④ 학부 학생회장은 집행위원회와 산하 국서를 지휘ㆍ감독한다.","⑤ 학부 학생회장은 집행위원회의 결정ㆍ집행 사항을 변경 또는 취소할 수 있다.","⑥ 학부 학생회장은 필요하다고 인정한 사안의 효율적 업무 집행을 위하여 제2항부터 제5항까지를 준용하여 직속 위원회를 설치할 수 있다.","⑦ 학부 학생회장은 학부 학생회장단과 집행위원회의 효율적인 집행을 보장하기 위하여 불가피하다고 판단할 때는 학부운영위원회의 동의 없이 사전 집행할 수 있다. 단, 학부 학생회장은 집행 직후 지체 없이 그 사실을 학부운영위원회에 보고하여 승인받아야 하며, 승인을 받지 못한 경우 원상회복을 위하여 노력하여야 한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제2관 권한"},{"no":115,"sub":0,"add":false,"title":"대외활동에 관한 사항","lines":["① 학부 학생회장은 학생자치활동에 관한 학교 행정의 문제에 대하여 회원의 의사를 대변하고 학교 당국에 의사를 개진하며 관련 단체 및 회의에 참여할 수 있다.","② 학부 학생회장은 본회와 본회의 회원에 관한 문제에 관하여 본회를 대표하여 대외적으로 입장을 표명하는 등의 활동을 할 수 있다. 이때 학부 학생회장은 제75조와 제97조에 따라 활동하여야 한다.","③ 학부 학생회장은 학부 학생회장단과 집행위원회의 효율적인 대외활동을 보장하기 위하여 불가피하다고 판단할 때는 학부운영위원회의 동의 없이 사전 집행할 수 있다. 단, 학부 학생회장은 활동 직후 지체 없이 그 사실을 학부운영위원회에 보고하여 승인받아야 하며, 승인을 받지 못한 경우 원상회복을 위하여 노력하여야 한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제2관 권한"},{"no":116,"sub":0,"add":false,"title":"인수위원회","lines":["① 학부 학생회장단 당선인은 학부 학생회장단과 집행위원회의 업무 인수를 위하여 당선 확정이 공고된 시점부터 자유전공학부 학생회 인수위원회를 설치할 수 있다. 단, 제174조 제2항에 따른 재선거의 당선인과 보궐선거의 당선인은 그러하지 아니한다.","② 인수위원회는 다음 각호의 직무를 수행한다.","1. 집행위원회의 조직ㆍ기능 및 예산 현황의 파악","2. 전임 학부 학생회장단과 집행위원회의 주요 사업 분석","3. 후임 집행위원회 정책의 기본 방향 수립을 위한 준비","4. 기타 학부 학생회장단과 집행위원회 업무의 인수에 필요한 사항","③ 인수위원장은 당선된 선거운동본부의 본부장으로 함을 원칙으로 하되, 필요할 때는 당선인이 별도로 정할 수 있다.","④ 인수위원회는 제106조에 따라 당선인의 학부 학생회장단 임기가 시작한 시점에 해산한다."],"ch":"제3장 집행기구","sec":"제1절 학부 학생회장단 · 제3관 학부 학생회장단 인수위원회"},{"no":117,"sub":0,"add":false,"title":"지위","lines":["집행위원회는 본회의 최고집행기구이다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":118,"sub":0,"add":false,"title":"국서","lines":["집행위원회는 원활한 업무 집행을 위하여 산하에 국서를 둘 수 있다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":119,"sub":0,"add":false,"title":"집행위원","lines":["① 집행위원회 산하 각 국서의 국장ㆍ국원은 집행위원이 된다.","② 집행위원은 집행위원회의 업무를 수행한다.","③ 각 국서의 국장과 국원은 학부 학생회장이 임명하고, 학부운영위원회의 인준으로 업무를 개시한다. 해당 임명에 관하여서는 학생대표자회의 사후 인준을 받아야 한다.","④ 모든 집행위원에 대하여 제3항의 사후 인준이 부결되면 학부 학생회장은 학부운영위원회에서 추천한 인원에게 집행위원의 직무를 대행하도록 하여야 한다.","⑤ 제4항에 따라 직무를 대행하는 자는 특별한 사유가 없는 한 학부 학생회장이 새로 임명한 집행위원이 학생대표자회의 인준을 받는 시점까지 그 업무를 수행한다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":120,"sub":0,"add":false,"title":"집행위원장","lines":["① 학부 학생회장은 원활한 운영을 위하여 집행위원장을 둘 수 있다.","② 집행위원장은 학부 학생회장단을 보좌하며, 본회 사무의 집행에 관하여 학부 학생회장단의 지시에 따라 각 국서를 관리ㆍ감독한다.","③ 집행위원장은 학부 학생회장이 임명하고, 학부운영위원회의 인준으로 업무를 개시한다. 해당 임명에 관하여서는 학생대표자회의 사후 인준을 받아야 한다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":121,"sub":0,"add":false,"title":"임기","lines":["① 집행위원회의 임기는 제106조에 따른 학부 학생회장단의 임기가 종료되는 시점까지로 한다.","② 제1항에도 불구하고 제112조 제1항 제2호부터 제4호까지에 따라 학부 학생회장단 권한대행 체제가 구성된 경우, 집행위원회의 임기는 해당 권한대행의 임기가 종료되는 시점까지로 한다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":122,"sub":0,"add":false,"title":"업무","lines":["① 집행위원회는 본회의 사업 집행 전반을 담당한다.","② 집행위원회는 학생총회, 학생대표자회, 학부운영위원회가 결정한 업무를 집행한다.","③ 집행위원회는 학부 학생회장단이 결정한 업무를 집행한다.","④ 집행위원회는 학생총회, 학생총투표, 학생대표자회, 학부운영위원회의 개의ㆍ시행을 준비하고, 이에 사용되는 각종 서식을 ｢고려대학교 총학생회 사무처리세칙｣에 따라 제작한다.","⑤ 집행위원회는 자치공간을 분배 및 회수할 수 있는 권한을 가진다.","⑥ 집행위원회는 본회의 사물함을 분배, 회수 및 철거할 수 있는 권한을 가진다.","⑦ 집행위원회는 학생총회, 학생대표자회, 학부운영위원회에 본회의 운영 사항을 보고하여야 한다.","⑧ 집행위원회는 본회의 예산안ㆍ결산을 작성하여 학생대표자회와 학부운영위원회에 보고하여야 한다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":123,"sub":0,"add":false,"title":"집행회의","lines":["집행위원회는 집행위원회의 업무에 속하는 사안을 심의하기 위하여 집행회의를 소집할 수 있다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":124,"sub":0,"add":false,"title":"계열회의","lines":["집행위원회는 원활한 업무 집행을 위하여 특정 국서의 국장과 각 반 학생회, 자치단체 및 특별기구 등의 동종 업무 담당 국장 혹은 이에 준하는 자가 참가하는 계열회의를 개최할 수 있다."],"ch":"제3장 집행기구","sec":"제2절 집행위원회"},{"no":125,"sub":0,"add":false,"title":"지위","lines":["임시집행위원회는 집행위원회에 준하는 권한을 가지며, 학부 학생회장단의 궐위 기간 집행위원회의 상시적 업무를 담당한다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":126,"sub":0,"add":false,"title":"국서","lines":["비상대책위원회는 임시집행위원회의 원활한 업무 진행을 위하여 국서를 둘 수 있다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":127,"sub":0,"add":false,"title":"임시집행위원","lines":["① 비상대책위원회는 임시집행위원회를 구성하기 위하여 각 반 학생회에 임시집행위원을 두 명씩 추천하도록 하며, 그 외 임시집행위원은 공고를 내어 공개모집 및 선발할 수 있다.","② 임시집행위원의 업무 개시와 인준 절차는 제119조를 준용한다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":128,"sub":0,"add":false,"title":"임시집행위원장","lines":["① 비상대책위원장은 원활한 운영을 위하여 임시집행위원장을 둘 수 있다.","② 임시집행위원장의 업무 개시와 인준 절차는 제120조를 준용한다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":129,"sub":0,"add":false,"title":"임기","lines":["임시집행위원회의 임기는 특별한 사유가 없는 한 임시집행위원회를 구성한 비상대책위원회가 해산하는 시점까지로 한다. 단, 제174조 제3항에 따른 재선거가 무산될 때는 2학기 종강일까지로 하며, 비상대책위원회는 제127조에 따라 새로 임시집행위원회를 구성하여야 한다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":130,"sub":0,"add":false,"title":"업무","lines":["임시집행위원회의 업무에 관하여서는 제122조부터 제124조까지를 준용한다."],"ch":"제3장 집행기구","sec":"제3절 임시집행위원회"},{"no":131,"sub":0,"add":false,"title":"지위","lines":["반 학생회는 본회의 A반, B반, C반, D반으로 분류되는 네 개의 반을 기준으로 하여 그에 속한 본회의 회원 전원이 회원의 지위를 가지고 반 학생회원의 단결 및 권리와 이익 보장을 위하여 자치활동을 하는 조직이다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":132,"sub":0,"add":false,"title":"회원","lines":["① 각 반 학생회에 소속된 본회의 회원은 해당 반 학생회의 회원이 된다. 이때 본회 회원의 반 학생회별 분류는 학부운영위원회에서 규칙으로 정한다.","② 반 학생회의 회원은 해당 반 학생회장단 선거의 선거권과 피선거권을 가진다.","③ 반 학생회의 회원은 해당 반 학생회 사업을 향유할 권리를 지닌다.","④ 그 밖의 반 학생회 회원의 유형, 권리, 의무 등에 관한 사항은 해당 반 학생회의 자치규칙으로 정한다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":133,"sub":0,"add":false,"title":"의결기관","lines":["① 반 학생총회는 반 학생회의 최고의결기관이며 소속 회원 전체로 구성된다.","② 반 학생회는 반 학생총회의 상설적인 의결기관으로 반 운영위원회를 둘 수 있다.","③ 반 학생회는 반 학생총회와 반 운영위원회의 중간 위계를 가지는 의결기관을 둘 수 있다.","④ 각 의결기관의 구성, 업무와 권한, 운영 등에 관하여서는 해당 반 학생회의 자치규칙으로 정한다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":134,"sub":0,"add":false,"title":"학생회장단","lines":["① 반 학생회장단은 각 반 학생회의 자치규칙에 따라 회원의 보통ㆍ평등ㆍ직접ㆍ비밀선거로 선출한다.","② 반 학생회장은 해당 반을 대표하며 학생대표자회 대의원 및 학부운영위원이 된다.","③ 반 학생회는 부학생회장을 둘 수 있으며, 이때 부학생회장은 학생대표자회 대의원이 된다.","④ 반 학생회장단의 선출, 임기, 업무와 권한, 의무 등에 관하여서는 해당 반 학생회의 자치규칙으로 정한다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":135,"sub":0,"add":false,"title":"집행기관","lines":["① 반 학생회는 반 학생회의 최고집행기관으로서 해당 반 학생회의 사업 집행 전반을 담당하는 반 집행위원회를 둘 수 있다.","② 반 집행위원회의 구성, 업무와 권한, 운영 등에 관하여서는 해당 반 학생회의 자치규칙으로 정한다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":136,"sub":0,"add":false,"title":"재정","lines":["① 반 학생회는 학부 학생회비에서 제186조 제2항에 따라 재정의 배분을 받는다.","② 반 학생회는 재정 배분에 관한 결정이 이루어지는 각종 절차에 참가할 권리가 있다.","③ 반 학생회는 제188조 제1항에 따라 예산안ㆍ결산을 작성하여 학생대표자회 정기회의 개의 7일 전까지 학부운영위원회에 제출하여야 한다.","④ 반 학생회는 학부운영위원회에 출석하여 제3항에 따라 제출한 예산안ㆍ결산을 보고하여야 한다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":137,"sub":0,"add":false,"title":"자치규칙","lines":["① 반 학생회는 자치규칙을 제정하여 자치에 필요한 전반적인 사항을 규정한다.","② 반 학생회는 자치규칙을 개정하였을 때는 지체 없이 학부운영위원회에 보고하여야 한다.","③ 반 학생회의 자치규칙이 없거나 부실하여 특정 사안에 관한 규정이 없을 때는 해당 반 학생회 의결기관의 의결로 본회의 회칙ㆍ세칙ㆍ규칙 또는 ｢고려대학교 총학생회 산하기구 회칙준칙｣의 전부 또는 일부를 적용하도록 할 수 있다. 단, 반 학생회가 새로 만들어져서 의결기관이 없는 경우 의결기관이 구성될 때까지는 별도의 의결 없이 가능하다."],"ch":"제4장 산하기구","sec":"제1절 반 학생회"},{"no":138,"sub":0,"add":false,"title":"지위","lines":["자치단체는 본회의 단체 중 본회의 등록 절차를 거쳐 특정한 분야에서 특정한 목적을 가지고 활동하는 단체이다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":139,"sub":0,"add":false,"title":"목적","lines":["① 자치단체는 본회의 목적에 맞게 성실히 활동하며 창조적 대학 문화 창달을 위하여 노력하는 것을 목적으로 한다.","② 자치단체는 본회의 회원들의 관심사에 따른 자발적인 참여를 보장함으로써 본회 회원의 결속 및 학생회의 발전에 이바지함을 목적으로 한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":140,"sub":0,"add":false,"title":"회원","lines":["① 각 자치단체에 소속된 본회의 회원은 해당 자치단체의 회원이 된다.","② 자치단체는 자치단체의 원활한 운영을 위하여 필요할 때는 본회의 회원이 아닌 자가 자치단체에 가입하는 것을 허용할 수 있다.","③ 자치단체의 회원은 해당 자치단체장 선거의 선거권과 피선거권을 가진다.","④ 자치단체의 회원은 해당 자치단체의 사업을 향유할 권리를 지닌다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":141,"sub":0,"add":false,"title":"자치단체장","lines":["① 자치단체장은 각 자치단체의 자치규칙에 따라 회원의 보통ㆍ평등ㆍ직접ㆍ비밀선거로 선출함을 원칙으로 한다.","② 자치단체장은 해당 자치단체를 대표하며 학생대표자회 대의원이 된다.","③ 자치단체는 부 자치단체장을 둘 수 있으며, 이때 부 자치단체장은 제52조 제3항에 따라 학생대표자회에서 의결권을 가질 수 있다.","④ 자치단체장의 선출, 임기, 업무와 권한, 의무 등에 관하여서는 해당 자치단체의 자치규칙으로 정한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":142,"sub":0,"add":false,"title":"등록","lines":["① 자치단체로 등록하고자 하는 단체는 학부운영위원회에 다음 각호의 서류를 제출한다. 이때 서류의 서식은 학부운영위원회에서 정하는 바에 따른다.","1. 회원 명부","2. 단체 소개서","3. 180일 이상의 지속적인 단체 활동을 증명하는 자료","4. 사업계획서","5. 학생회칙 준수서약서","② 학부운영위원회는 제1항에 따라 제출받은 서류에 형식상의 결함이 없는지 심의하며, 문제가 없다면 의결로 학생대표자회에 해당 단체의 자치단체 등록에 관한 안건을 상정한다.","③ 학생대표자회는 제2항에 따라 상정된 단체의 자치단체 등록을 심의하여 의결한다.","④ 학생대표자회는 다음 각호 중 어느 하나에 해당하는 경우에만 자치단체의 등록을 거절할 수 있다. 이때 단체의 특수한 목적 및 사정을 고려하여야 한다.","1. 단체의 존속 가능성이 불분명한 경우","2. 단체의 활동과 목적이 본회가 추구하는 가치에 명백히 반하는 경우","3. 10명 미만의 회원만이 활동하는 것으로 판단되는 경우","4. 본회의 회원이 구성원의 2분의 1 미만인 경우","5. 사회상규에 비추어 본회로의 등록이 용인되기 힘든 수준의 사유를 지니는 경우"],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":143,"sub":0,"add":false,"title":"인준","lines":["① 자치단체는 매년 1학기 학생대표자회 정기회의에서 인준을 받아야 한다.","② 자치단체는 1학기 학생대표자회 정기회의 개의 7일 전까지 학생대표자회 의장에게 다음 각호의 서류를 제출하여야 한다. 이때 서류의 서식은 학부운영위원회에서 정하는 바에 따른다.","1. 회원 명부","2. 전년도 활동보고서","3. 금년도 활동계획서","③ 학생대표자회는 제142조 제4항 각호의 요건을 고려하여 자치단체의 인준을 심의하고 의결한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":144,"sub":0,"add":false,"title":"재인준","lines":["① 제143조에 따른 인준이 부결된 자치단체는 그 해 2학기 학생대표자회 정기회의에서 재인준 절차를 거쳐야 한다.","② 제1항에 해당하는 자치단체는 학생대표자회 정기회의 개의 7일 전까지 학생대표자회 의장에게 다음 각호의 서류를 제출하여야 한다. 이때 서류의 서식은 학부운영위원회에서 정하는 바에 따른다.","1. 회원 명부","2. 전년도 활동보고서","3. 금년도 활동계획서","4. 인준 부결 사유 소명서","③ 학생대표자회는 제142조 제4항 각호의 요건을 고려하여 자치단체의 재인준을 심의하고 의결한다.","④ 재인준이 부결된 자치단체는 제146조에 따라 자치공간 및 본회로부터 받았던 모든 자산을 반환하여야 한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":145,"sub":0,"add":false,"title":"탈퇴","lines":["① 자치단체는 본회에서 탈퇴할 수 있다.","② 탈퇴하고자 하는 자치단체는 자치단체장과 해당 자치단체의 구성원 3분의 2 이상의 서명을 포함한 탈퇴 요청서를 학부운영위원회에 제출하여야 한다.","③ 학부운영위원회는 제2항에 따라 제출된 자치단체의 탈퇴 요청서에 형식상의 결함을 심의한다. 이때 서명의 기준이 되는 자치단체의 구성원 총수는 학부운영위원회에서 의결로 결정한다.","④ 탈퇴를 신청한 자치단체의 장은 제3항의 학부운영위원회 회의에 출석하여야 한다.","⑤ 학부운영위원회는 제3항의 심의 결과에 문제가 없다면 의결로 학생대표자회에 해당 자치단체의 탈퇴에 관한 안건을 상정한다.","⑥ 학생대표자회는 제5항에 따라 상정된 자치단체의 탈퇴를 심의하여 의결한다.","⑦ 학생대표자회 의장은 자치단체의 탈퇴가 승인되었으면 이를 지체 없이 공고하고, 공고한 시점으로부터 48시간 동안 이의제기를 받는다.","⑧ 제7항의 이의제기가 있을 때는 학생대표자회 의장은 지체 없이 회의를 소집하여 이를 심의하고 인용 여부를 결정한다.","⑨ 탈퇴 승인 공고로부터 48시간 이내에 이의가 없거나, 제8항에 따른 이의의 인용이 부결되었을 때 탈퇴를 승인받은 자치단체의 인준 또는 재인준은 취소된다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":146,"sub":0,"add":false,"title":"반환","lines":["재인준이 부결되거나 탈퇴로 인하여 인준 또는 재인준이 취소된 자치단체는 해당 결정 또는 취소된 날로부터 30일 이내에 자치공간 및 본회로부터 받았던 모든 자산을 본회에 반환하여야 한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":147,"sub":0,"add":false,"title":"자치규칙","lines":["① 자치단체는 자치규칙을 제정하여 자치에 필요한 전반적인 사항을 규정한다.","② 자치단체는 자치규칙을 개정하였을 때는 지체 없이 학부운영위원회에 보고하여야 한다."],"ch":"제4장 산하기구","sec":"제2절 자치단체"},{"no":148,"sub":0,"add":false,"title":"지위","lines":["독립기구는 본회에서 특별한 공정성과 중립성을 요구하는 업무를 독자적으로 수행하기 위하여 설치된 기구이다."],"ch":"제5장 독립기구","sec":"제1절 통칙"},{"no":149,"sub":0,"add":false,"title":"독립성","lines":["독립기구는 그 권한에 속하는 업무를 수행하는 데 있어서 학생총회 및 학생총투표를 제외한 모든 의결기구, 학부 학생회장단, 집행위원회로부터 독립적인 위상을 보장받는다."],"ch":"제5장 독립기구","sec":"제1절 통칙"},{"no":150,"sub":0,"add":false,"title":"의무","lines":["① 독립기구는 운영과 업무 수행에 관하여 중립적으로 결정하고 자율적으로 집행하여야 한다.","② 독립기구는 운영과 업무 수행에 관하여 공공성과 투명성을 확보하도록 노력하여야 한다."],"ch":"제5장 독립기구","sec":"제1절 통칙"},{"no":151,"sub":0,"add":false,"title":"목적","lines":["선거관리위원회는 민주적이고 공정한 절차에 따라 선거를 효율적으로 진행하는 것을 목적으로 한다."],"ch":"제5장 독립기구","sec":"제2절 선거관리위원회"},{"no":152,"sub":0,"add":false,"title":"구성","lines":["① 다음 각호에 해당하는 사람은 선거관리위원이 된다. 단, 학부 학생회장단은 필요한 경우 일부만을 선거관리위원으로 파견할 수 있다.","1. 학부 학생회장단 전원","2. 각 반 학생회에서 파견한 2명","② 학부 학생회장단과 각 반 학생회는 후보 등록 마감일 10일 전까지 위원을 파견하여야 한다.","③ 각 반 학생회에서 위원으로 파견되는 사람은 소속 의결기관의 의결을 거쳐야 한다.","④ 선거관리위원은 학부운영위원회에서 심사를 거쳐 업무를 개시하여야 한다.","⑤ 선거관리위원장은 선거관리위원회 내부에서 선출한다."],"ch":"제5장 독립기구","sec":"제2절 선거관리위원회"},{"no":153,"sub":0,"add":false,"title":"업무ㆍ권한","lines":["① 선거관리위원회는 회칙ㆍ세칙ㆍ규칙에 따라 민주적이고 공정한 선거 절차를 진행한다.","② 선거관리위원회는 선거에 관한 모든 업무의 최고 결정권과 집행권을 가지며, 학생총회와 학생총투표를 제외한 어떠한 의결기구도 회칙에 따른 선거 관련 결정 및 집행을 변경 또는 취소할 수 없다. 단, 학생대표자회는 선거관리위원회의 선거 관련 결정 및 집행에 의견을 제출할 수 있고 선거관리위원회는 이를 존중하여야 한다.","③ 학부 학생회장단, 집행위원회 및 학부운영위원회는 선거기간에 사업 집행 및 의견 표명 등을 하기 위해서는 선거관리위원회의 허가를 받아야 하며, 선거관리위원회는 선거에 영향을 미칠 수 있다고 인정되는 행위를 허가하지 않을 수 있다.","④ 선거관리위원회는 선거의 원활한 진행을 위하여 집행위원회에 사무 처리의 협조를 얻을 수 있다."],"ch":"제5장 독립기구","sec":"제2절 선거관리위원회"},{"no":154,"sub":0,"add":false,"title":"재정","lines":["본회는 선거관리위원회의 원활한 운영을 위한 재원을 마련하여야 한다."],"ch":"제5장 독립기구","sec":"제2절 선거관리위원회"},{"no":155,"sub":0,"add":false,"title":"선거시행세칙","lines":["그 밖의 선거관리위원회에 관한 자세한 사항은 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣으로 정한다."],"ch":"제5장 독립기구","sec":"제2절 선거관리위원회"},{"no":156,"sub":0,"add":false,"title":"목적","lines":["투표관리위원회는 민주적이고 공정한 절차에 따라 학생총투표를 효율적으로 진행하는 것을 목적으로 한다."],"ch":"제5장 독립기구","sec":"제3절 투표관리위원회"},{"no":157,"sub":0,"add":false,"title":"구성","lines":["투표관리위원회는 학생총투표 시행이 결정되면 학생총회 의장을 위원장으로 하여 학부운영위원, 제79조 제3항에 따라 의결권을 가질 수 있는 사람 및 이에 준하는 사람을 위원으로 구성한다. 단, 학부 학생회장단은 학부 학생회장단 탄핵안에 대한 학생총투표에서는 투표관리위원이 될 수 없다."],"ch":"제5장 독립기구","sec":"제3절 투표관리위원회"},{"no":158,"sub":0,"add":false,"title":"업무ㆍ권한","lines":["① 투표관리위원회는 회칙ㆍ세칙ㆍ규칙에 따라 민주적이고 공정한 학생총투표 절차를 진행한다.","② 투표관리위원회는 학생총투표에 관한 모든 업무의 최고 결정권과 집행권을 가지며, 학생총회를 제외한 어떠한 의결기구도 회칙에 따른 학생총투표 관련 결정 및 집행을 변경 또는 취소할 수 없다. 단, 학생대표자회는 투표관리위원회의 학생총투표 관련 결정 및 집행에 의견을 제출할 수 있고 투표관리위원회는 이를 존중하여야 한다.","③ 학부 학생회장단 및 집행위원회는 학생총투표 기간에 사업 집행 및 의견 표명 등을 하기 위해서는 투표관리위원회의 허가를 받아야 하며, 투표관리위원회는 학생총투표에 영향을 미칠 수 있다고 인정되는 행위를 허가하지 않을 수 있다.","④ 투표관리위원회는 학생총투표의 원활한 진행을 위하여 집행위원회에 시행 준비를 보조받을 수 있다."],"ch":"제5장 독립기구","sec":"제3절 투표관리위원회"},{"no":159,"sub":0,"add":false,"title":"재정","lines":["본회는 투표관리위원회의 원활한 운영을 위한 재원을 마련하여야 한다."],"ch":"제5장 독립기구","sec":"제3절 투표관리위원회"},{"no":160,"sub":0,"add":false,"title":"준용","lines":["그 밖의 투표관리위원회에 관한 자세한 사항은 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣의 선거관리위원회에 관한 규정을 준용한다."],"ch":"제5장 독립기구","sec":"제3절 투표관리위원회"},{"no":161,"sub":0,"add":false,"title":"지위","lines":["① 특별기구는 본회의 특수한 영역과 기능을 담당하기 위하여 설치된 상설기구이다.","② 특별기구는 학부 학생회장단으로부터 그 업무의 감독을 받는다. 다만, 집행위원회로부터는 독립적인 위상을 보장받는다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":162,"sub":0,"add":false,"title":"성립 요건","lines":["특별기구는 다음 각호 중 어느 하나 이상의 요건을 갖추어 설치가 필요하다고 인정될 때 설치된다.","1. 본회 회원의 권익 보호를 위한 전문적 활동을 꾸준히 수행하여 특별기구로서의 정체성이 확보되어 있는 단체","2. 본회 차원의 포괄적ㆍ대외적 사업이 필요한 분야에 관련된 단체"],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":163,"sub":0,"add":false,"title":"회원","lines":["① 본회의 회원은 특별기구의 회원이 될 수 있다.","② 특별기구 회원의 유형ㆍ권리 및 의무 등에 관하여서는 해당 특별기구의 자치규칙으로 정한다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":164,"sub":0,"add":false,"title":"기구장","lines":["① 특별기구장은 해당 특별기구의 자치규칙에 따라 회원의 보통ㆍ평등ㆍ직접ㆍ비밀선거로 선출함을 원칙으로 한다.","② 특별기구장은 해당 특별기구를 대표한다.","③ 특별기구장은 제52조 제4항에 따라 한시적으로 학생대표자회의 대의원이 될 수 있다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":165,"sub":0,"add":false,"title":"재정","lines":["① 특별기구는 학부 학생회비에서 제186조 제3항에 따라 재정의 배분을 받는다.","② 특별기구는 재정 배분에 관한 결정이 이루어지는 각종 절차에 참가할 권리가 있다.","③ 특별기구는 제188조 제1항에 따라 예산안ㆍ결산을 작성하여 학생대표자회 정기회의 개의 7일 전까지 학부운영위원회에 제출하여야 한다.","④ 특별기구는 학부운영위원회에 출석하여 제3항에 따라 제출한 예산안ㆍ결산을 보고하여야 한다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":166,"sub":0,"add":false,"title":"자치규칙","lines":["① 특별기구는 자치규칙을 제정하여 자치에 필요한 전반적인 사항을 규정한다.","② 특별기구는 자치규칙을 개정하였을 때는 지체 없이 학부운영위원회에 보고하여야 한다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":167,"sub":0,"add":false,"title":"협의","lines":["① 특별기구는 학부운영위원회에 출석하여 사업을 제안하거나 협의할 수 있다.","② 특별기구는 사업의 기획과 집행에 관하여 필요한 경우 집행위원회와 협의할 수 있다."],"ch":"제6장 특별기구","sec":"제1절 통칙"},{"no":168,"sub":0,"add":false,"title":"인준","lines":["① 특별기구로 인준되고자 하는 단체는 학부운영위원회에 다음 각호의 서류를 제출한다. 이때 서류의 서식은 학부운영위원회에서 정하는 바에 따른다.","1. 회원명부","2. 소개서","3. 사업계획서","4. 학생회칙 준수서약서","5. 예산안","6. 본회의 회원 30명 이상의 추천이 있는 추천서","② 학부운영위원회는 제1항에 따라 제출받은 서류를 검토하여 형식상의 결함과 해당 단체가 제162조 각호의 요건 중 어느 하나 이상을 충족하는지를 심의하며, 문제가 없다면 의결로 학생대표자회에 해당 단체의 특별기구 인준에 관한 안건을 상정한다.","③ 학부운영위원회는 제2항에 따라 안건을 상정할 때는 심의서를 작성하여 안건과 함께 학생대표자회에 제출한다.","④ 학생대표자회는 제2항에 따라 상정된 단체의 특별기구 인준을 심의하여 의결한다."],"ch":"제6장 특별기구","sec":"제2절 인준"},{"no":169,"sub":0,"add":false,"title":"재인준","lines":["① 특별기구는 매년 1학기 학생대표자회 정기회의 개의 7일 전까지 학부운영위원회에 다음 각호의 서류를 제출하여야 한다. 이때 서류의 서식은 학부운영위원회에서 정하는 바에 따른다.","1. 회원 명부","2. 전년도 활동보고서","3. 금년도 활동계획서","② 학부운영위원회는 제1항에 따라 제출된 서류를 검토하여 형식상의 결함과 해당 특별기구가 제162조 각호의 요건 중 어느 하나 이상을 충족하는지를 심의하며, 문제가 없다면 의결로 학생대표자회에 각 특별기구의 재인준에 관한 안건을 상정한다.","③ 학부운영위원회는 제2항의 재인준에 관한 안건 상정이 부결될 때는 해당 특별기구의 부결 사유를 포함한 심의서를 작성하여 학생대표자회에 별도의 안건으로 상정하여야 한다.","④ 제2항의 재인준에 관한 안건 상정이 부결된 특별기구는 학생대표자회에 그 심의 부결에 대한 소명서를 작성하여 제출하여야 한다.","⑤ 학생대표자회는 제2항과 제3항에 따라 상정된 특별기구의 재인준을 심의하고 의결한다.","⑥ 학생대표자회 의장은 제5항의 심의에서 재인준이 부결되면 즉시 제72조에 따라 해당 특별기구의 징계 안건을 상정한다."],"ch":"제6장 특별기구","sec":"제2절 인준"},{"no":169,"sub":2,"add":false,"title":"해산","lines":["① 특별기구는 해산할 수 있다.","② 해산하고자 하는 특별기구는 학부운영위원회에 직전 재인준 당시 제출한 회원명부를 기준으로 재적 회원 3분의 2 이상의 서명을 포함한 해산 요청서를 제출하여야 한다.","③ 제168조에 따라 최초 인준된 날로부터 2년(4학기)이 경과하지 아니한 특별기구는 해산을 신청할 수 없다. 단, 기구의 존속이 불가능한 중대한 사유가 있는 경우 학부운영위원회의 의결로 예외를 둘 수 있다.","④ 학부운영위원회는 제2항에 따라 제출된 해산 요청서 형식상 결함을 심의하며, 특별기구장은 해당 심의에 출석하여야 한다.","⑤ 학부운영위원회는 해산 요청서에 결함이 없으면 학생대표자회에 해당 특별기구의 해산 안건을 상정한다.","⑥ 학생대표자회는 해산 여부를 의결하며 해산을 승인받은 특별기구의 인준 또는 재인준은 그 승인 시점부터 48시간 이후에 취소된다.","⑦ 학생대표자회는 다음 각호의 경우 해산을 거절할 수 있다.","1. 특별기구가 여전히 본회의 특수한 기능을 수행할 수 있으며, 해산 시 회원의 권리가 침해될 것이 예상되는 때","2. 해산 요청서의 서식 및 정보가 부실하여 무효라고 판단되는 때","3. 회칙에 명시된 해산 이외의 절차가 선행될 수 있을 때"],"ch":"제6장 특별기구","sec":"제2절 인준"},{"no":170,"sub":0,"add":false,"title":"선거","lines":["① 학부 학생회장단은 회원의 보통ㆍ평등ㆍ직접ㆍ비밀선거로 선출한다.","② 학부 학생회장단 선거에는 학부 학생회장 후보 단독으로 입후보하거나 학부 학생회장 후보와 학부 부학생회장 후보 각 한 명이 조를 이루어 입후보할 수 있다.","③ 유효투표 중 최다 득표한 조 또는 후보에 대한 “찬성”표의 수가 “반대” 및 “기권”표의 합보다 많은 조가 학부 학생회장단으로 당선된다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":171,"sub":0,"add":false,"title":"시기","lines":["① 학부 학생회장단 선거는 매년 11월에 시행함을 원칙으로 한다.","② 학부 학생회장단 선거에 관한 자세한 일정은 학부운영위원회에서 정한다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":172,"sub":0,"add":false,"title":"선거권ㆍ피선거권","lines":["① 본회의 정회원은 학부 학생회장단 선거의 선거권을 가지며, 선거권자 총수에 포함된다.","② 제1항에도 불구하고 본회의 국제 회원은 학부 학생회장단 선거의 선거권을 행사한 경우에만 선거권자 총수에 포함된다.","③ 본회의 준회원ㆍ수료회원은 학부 학생회장단 선거의 선거권을 가지며, 선거권을 행사한 경우에만 선거권자 총수에 포함된다.","④ 본회의 정회원으로서, 3학기 이상 등록한 자는 학부 학생회장단 선거의 피선거권이 있다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":173,"sub":0,"add":false,"title":"선거관리위원회","lines":["① 학부 학생회장단 선거를 공정하고 민주적으로 관리하기 위하여 선거관리위원회를 둔다.","② 그 밖의 선거관리위원회에 관한 자세한 사항은 제151조부터 제155조까지를 따른다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":174,"sub":0,"add":false,"title":"재선거","lines":["① 다음 각호 중 어느 하나에 해당하면 재선거를 시행한다. 다만, 조를 이루어 당선된 학부 학생회장단 당선 조에서 한 명만 제3호 또는 제4호에 해당할 때는 그러하지 아니한다.","1. 학부 학생회장단 선거의 후보자가 없는 경우","2. 학부 학생회장단 선거의 당선인이 없는 경우","3. 학부 학생회장단 당선인이 임기 개시 전에 사망한 경우","4. 학부 학생회장단 당선인이 임기 개시 전에 선거권ㆍ피선거권 박탈 이상의 징계를 받은 경우","5. 학부 학생회장단 당선인이 소속된 선거운동본부가 임기 개시 전에 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣에서 정한 징계 사유가 새로 발견되어 후보 자격이 박탈된 경우","6. 그 밖의 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣에서 정한 사유가 발생한 경우","② 재선거는 제1항의 사유가 발생한 이듬해 3월에 실시함을 원칙으로 한다.","③ 제2항에 따른 재선거가 무산되어 실시하는 재선거는 같은 해 11월에 시행함을 원칙으로 한다.","④ 제3항에 따른 재선거가 무산된 이후 시행하는 재선거의 시기에 관하여서는 제2항 및 제3항을 준용한다.","⑤ 제2항 및 제3항에 따라 시행하는 재선거에는 차수를 표시하여 이전 재선거와 구분한다.","⑥ 재선거에 관한 자세한 일정은 학부운영위원회 또는 비상대책위원회에서 정한다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":175,"sub":0,"add":false,"title":"보궐선거","lines":["① 학부 학생회장단이 사퇴ㆍ탄핵 및 당연퇴직 등으로 궐위되었으며, 잔여 임기가 180일을 초과하면 보궐선거를 시행한다.","② 학부운영위원회는 제1항의 사유가 발생한 날부터 10일 이내에 보궐선거의 시행 일정을 결정하여야 한다.","③ 학부운영위원회는 보궐선거의 시행 일정이 확정한 날로부터 20일 이내에 보궐선거를 시행하여야 한다.","④ 학부운영위원회는 잔여 임기가 180일이 넘지 않은 경우에도 선거의 필요성, 선거 시기, 잔여 임기 등 본회의 제반 사정을 고려하여 보궐선거의 시행을 결정할 수 있다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":176,"sub":0,"add":false,"title":"선거시행세칙","lines":["그 밖의 선거에 관한 사항은 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣으로 정한다."],"ch":"제7장 선거","sec":"제1절 학부 학생회장단 선거"},{"no":177,"sub":0,"add":false,"title":"동시선거","lines":["본 회칙에서 “동시선거”라 함은 본회 및 본회 각 반 학생회의 학생회장단 선거 중 2 이상의 선거를 동일한 일정에 따라 시행하는 것을 말한다."],"ch":"제7장 선거","sec":"제2절 동시선거"},{"no":178,"sub":0,"add":false,"title":"동시선거의 진행","lines":["① 학부운영위원회는 의결로 동시선거를 진행할 수 있다.","② 동시선거에 관한 자세한 일정은 학부운영위원회에서 정한다.","③ 동시선거에 있어서 선거의 진행은 본 회칙 및 ｢고려대학교 자유전공학부 학부ㆍ반 선거시행세칙｣에 따른다.","④ 제2항에도 불구하고 동시선거에 있어서 다음 각호의 경우는 각 반 학생회의 자치규칙에 따른다. 이때 제3호의 경우 학부운영위원회의 의결로 결정한다.","1. 각 반 학생회장단 선거의 피선거권","2. 각 반 학생회장단 당선인의 임기","3. 그 밖의 각 반 학생회의 자치규칙에 따르는 것이 적절하다고 인정된 경우","⑤ 동시선거를 진행하지 않는 경우 각 반 학생회장단 선거의 진행은 각 반 학생회의 자치규칙에 따른다."],"ch":"제7장 선거","sec":"제2절 동시선거"},{"no":179,"sub":0,"add":false,"title":"원칙","lines":["본회의 각 기구는 재정을 효율적이고 투명하게 운용하여야 한다."],"ch":"제8장 재정","sec":"제1절 통칙"},{"no":180,"sub":0,"add":false,"title":"재정운용세칙","lines":["그 밖의 재정 운용에 관한 사항은 각 의결기구의 의결로 ｢고려대학교 총학생회 재정운용세칙｣을 준용한다."],"ch":"제8장 재정","sec":"제1절 통칙"},{"no":181,"sub":0,"add":false,"title":"자산","lines":["① 본회는 유ㆍ무형의 동산, 부동산 및 권리 등을 소유할 수 있으며, 이를 본회의 자산이라 한다.","② 본회의 자산은 각 기구가 독립하여 취득ㆍ사용ㆍ보관 및 처분함을 원칙으로 한다.","③ 본회의 산하기구 및 특별기구는 회칙의 취지에 어긋나지 아니하는 범위에서 그 자산에 관하여 필요한 사항을 각 기구의 의결기관의 의결 또는 자치규칙으로 정할 수 있다."],"ch":"제8장 재정","sec":"제2절 자산"},{"no":182,"sub":0,"add":false,"title":"집행기구 자산","lines":["다음 각호 중 어느 하나에 해당하는 것은 집행기구의 자산으로 본다.","1. 취득 과정에서 본회의 자산이 투입되어 취득한 것","2. 학부 학생회장단, 집행위원 또는 이에 준하는 자가 그 직으로 취득한 것","3. 본회 집행기구의 사업 또는 사무 집행을 위하여 취득하였거나 사업 집행의 결과물로 취득한 것","4. 제1호부터 제3호까지에 해당하는 자산으로부터 파생된 것"],"ch":"제8장 재정","sec":"제2절 자산"},{"no":183,"sub":0,"add":false,"title":"자산의 관리","lines":["① 집행기구는 자산의 취득ㆍ사용ㆍ보관 및 처분이 본회의 이익을 위하여 적정하고 효율적으로 이루어지도록 노력하여야 한다.","② 집행기구는 제작, 구매, 수증 등의 방법으로 자산을 취득한다.","③ 집행기구의 자산은 본회 사업과 사무의 집행을 위하여 사용함을 원칙으로 한다.","④ 집행기구의 자산은 대여를 목적으로 한 자산이거나 대여하여도 본회 사업 또는 사무에 지장이 없는 자산이어야만 대여할 수 있으며, 본회의 각 기구와 회원에게 우선으로 대여하여야 한다.","⑤ 집행기구는 자산을 언제든지 사용하거나 처분할 수 있도록 선량한 관리자의 주의로 보관하여야 한다.","⑥ 집행기구는 사용할 필요가 없거나 사용할 수 없는 자산을 교환, 매각, 증여, 폐기 등의 방법으로 처분할 수 있다.","⑦ 집행기구는 자산의 중대한 변화를 불러오는 집행에 관하여 학부운영위원회의 인준을 받아야 한다.","⑧ 집행기구는 제7항에 따라 인준받은 집행을 회원들에게 예고하여야 하며, 해당 집행 이후 자산 변화를 공고하여야 한다."],"ch":"제8장 재정","sec":"제2절 자산"},{"no":184,"sub":0,"add":false,"title":"취소ㆍ변경","lines":["학부운영위원회는 집행기구의 자산 취득, 사용, 보관 및 처분이 본회의 이익을 위한 것이 아니거나, 적정성 또는 효율성이 없다고 판단되면 이를 변경하거나 취소할 수 있다."],"ch":"제8장 재정","sec":"제2절 자산"},{"no":185,"sub":0,"add":false,"title":"수입","lines":["본회 재정의 수입은 학부 학생회비, 지원금, 사업별 후원금, 그 밖의 수익금으로 한다."],"ch":"제8장 재정","sec":"제2절 자산"},{"no":186,"sub":0,"add":false,"title":"학생회비","lines":["① 학부 학생회비는 일시납부 및 1회 납부를 원칙으로 한다. 단, 일시에 납부하지 못할 경제적ㆍ사회적 또는 그 밖의 중대한 사유가 있는 경우 분할하여 납부할 수 있다.","② 학부 학생회비의 수입 중 반 학생회에 배분되는 금액은 반 학생회 소속 학생회비 납부자 1인당 50,000원으로 한다.","③ 학부 학생회비의 수입 중 특별기구에 배분되는 금액은 학부운영위원회에서 각 특별기구와 협의하여 결정한다.","④ 학부 학생회비의 수입 중 집행기구에 배분되는 금액은 제2항 및 제3항에 따라 배분되는 금액을 제외한 금액으로 한다.","⑤ 다음 각호에 해당하는 기구의 재정은 제4항에 따른 집행기구 재정에서 사용하며, 재정 운용의 책임은 집행위원회에 있다.","1. 의결기구","2. 자치단체","3. 독립기구","⑥ 학생대표자회는 학부 학생회비의 인상ㆍ인하가 필요하다고 판단하면 매년 2학기 정기회의에서 학부 학생회비의 조정을 논의할 수 있다."],"ch":"제8장 재정","sec":"제2절 자산"},{"no":187,"sub":0,"add":false,"title":"회계연도","lines":["본회의 재정은 다음 각호의 기간으로 나누어 집행하고 결산한다.","1. 제1분기: 2학기 종강일 다음 날부터 1학기 개강일 전날까지","2. 제2분기: 1학기 개강일부터 1학기 종강일까지","3. 제3분기: 1학기 종강일 다음 날부터 2학기 개강일 전날까지","4. 제4분기: 2학기 개강일부터 2학기 종강일까지"],"ch":"제8장 재정","sec":"제3절 회계ㆍ심의"},{"no":188,"sub":0,"add":false,"title":"사전 심의","lines":["① 집행위원회, 반 학생회, 특별기구 및 그 밖의 학부 학생회비를 사용하는 기구는 다음 각호에 따라 예산안ㆍ결산을 작성하여 학생대표자회 정기회의 개의 7일 전까지 학부운영위원회에 제출하여야 한다.","1. 1학기 정기회의: 작년도 4분기, 금년도 1분기의 결산과 금년도 2분기ㆍ3분기의 예산안","2. 2학기 정기회의: 금년도 2분기ㆍ3분기의 결산과 금년도 4분기, 익년도 1분기의 예산안","② 학부운영위원회는 제1항에 따른 예산안ㆍ결산 제출 기한을 정하여 공고한다.","③ 학부운영위원회는 제1항에 따라 제출된 예산안ㆍ결산을 사전 심의한다."],"ch":"제8장 재정","sec":"제3절 회계ㆍ심의"},{"no":189,"sub":0,"add":false,"title":"승인","lines":["① 집행위원회, 반 학생회, 특별기구 및 그 밖의 학부 학생회비를 사용하는 기구는 제188조 제3항의 사전 심의를 거친 예산안ㆍ결산을 학생대표자회에 보고하여야 한다.","② 학생대표자회는 제1항에 따라 보고된 예산안ㆍ결산을 승인한다.","③ 학생대표자회에서 승인된 예산안ㆍ결산은 공개되어야 한다."],"ch":"제8장 재정","sec":"제3절 회계ㆍ심의"},{"no":190,"sub":0,"add":false,"title":"징계","lines":["① 학생대표자회는 제189조 제2항의 회의에서 다음 각호 중 어느 하나에 해당하는 기구가 있으면 제2항에 따라 징계한다.","1. 학생대표자회 또는 학부운영위원회에 예산안ㆍ결산을 제출하지 아니한 기구","2. 학생대표자회에서 예산안ㆍ결산 승인이 부결된 기구","② 제1항에 따른 징계는 다음 각호 중 하나로 한다. 단, 제4호의 경우 다른 징계와 함께 하도록 결정할 수 있다.","1. 해당 학기의 학부 학생회비 미지급","2. 해당 학기의 학부 학생회비 지급액 삭감","3. 해당 학기의 학부 학생회비 지급 보류","4. 사과문ㆍ경위서 게재 요구","③ 배임, 횡령 등 중대한 문제의 경우 학생대표자회는 제2항의 징계와 함께 다음 각호의 조치를 함께 결정할 수 있다. 이때 제3호의 경우 제1항 당시 대표자와 학부 학생회비가 불법하게 사용될 당시 대표자가 함께 책임을 져야 한다.","1. 기구가 가지고 있는 학부 학생회비 잔금 사용 중지","2. 기구가 가지고 있는 학부 학생회비 잔금 전액 환수","3. 기구가 불법하게 사용한 학부 학생회비 전액 반환","4. 그 밖의 ｢고려대학교 자유전공학부 징계세칙｣에 따른 징계"],"ch":"제8장 재정","sec":"제3절 회계ㆍ심의"},{"no":191,"sub":0,"add":false,"title":"목적","lines":["본회의 자치공간은 본회의 자치활동의 기초가 되는 토대로서, 회원의 교류 및 결속을 공고히 하고 회원을 보호하며 안정을 보장하는 역할을 통해 창조적이고 진보적인 대학 문화를 건설하는데 이바지함을 목적으로 한다."],"ch":"제9장 자치공간","sec":""},{"no":192,"sub":0,"add":false,"title":"자치공간","lines":["① 본회의 자치공간은 다음 각호로 정한다.","1. 학부 학생회실","2. 반 학생회실","3. 자치단체실","4. 특별기구실","5. 코웍스","6. 범울터","7. 기타 본회의 노력으로 확보 또는 양도받은 공간","② 본회의 각 기구는 각 기구에 주어진 자치공간을 자유롭게 이용, 보수 및 개조할 수 있다."],"ch":"제9장 자치공간","sec":""},{"no":193,"sub":0,"add":false,"title":"자치공간운영세칙","lines":["그 밖의 자치공간에 관한 자세한 내용은 ｢고려대학교 자유전공학부 자치공간운영세칙｣으로 정한다."],"ch":"제9장 자치공간","sec":""},{"no":194,"sub":0,"add":false,"title":"개정안 발의","lines":["① 회칙 개정안은 다음 각호 중 하나에 따라 발의된다.","1. 학부운영위원회 의결에 의한 발의","2. 학부운영위원회 재적 위원 과반수의 연서에 따른 발의","3. 학생대표자회 재적 위원 3분의 1 이상의 연서에 따른 발의","4. 본회의 회원 50명 이상의 연서에 따른 발의","5. 본회의 의결기구가 회칙 개정 발의에 관한 권한을 위임한 특별위원회의 발의","② 연서에 따른 발의는 ｢고려대학교 총학생회 사무처리세칙｣에서 정한 서식에 의한다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":195,"sub":0,"add":false,"title":"개정안 공고","lines":["학생대표자회 의장은 회칙 개정안이 발의되면 다음 각호의 사항을 5일 이상 공고하여야 한다. 단, 회칙 개정안이 전부개정안이면 제2호를 개정안 전문으로 대신할 수 있다.","1. 회칙 개정안의 제안 이유와 주요 내용","2. 신ㆍ구조문 대비표","3. 제194조에 따른 회칙 개정안 발의자 명단"],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":196,"sub":0,"add":false,"title":"의견 수렴","lines":["회칙 개정안을 발의한 자의 대표는 회칙 개정을 위한 학생대표자회 개의에 앞서 학부운영위원회에 의견을 요청하거나, 별도의 공청회 등을 통하여 의견을 수렴할 수 있다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":197,"sub":0,"add":false,"title":"개정안 심의","lines":["① 학생대표자회는 제194조에 따라 발의된 회칙 개정안을 심의한다.","② 개정안 심의 과정에는 축조심사와 찬반 토론이 포함되어야 한다. 단, 일부개정안은 의결로 축조심사를 생략할 수 있다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":198,"sub":0,"add":false,"title":"개정 의결","lines":["① 학생대표자회는 제61조 제2항 제2호에 따라 재적 대의원 3분의 2 이상의 출석과 출석 대의원 3분의 2 이상의 찬성으로 회칙 개정을 의결한다.","② 회칙 개정의 의결은 제62조 제4항에 따라 기명투표로 표결한다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":199,"sub":0,"add":false,"title":"개정안 정리","lines":["회칙 개정의 의결 후 저촉되는 조항ㆍ자구ㆍ숫자 및 그 밖의 기타 정리가 필요하면 학부운영위원회는 회칙 개정의 공포 전까지 이를 검토하여 정리할 수 있다. 단, 정리 과정에서 의결된 사항의 내용이나 취지를 변경하는 것은 허용되지 아니한다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":200,"sub":0,"add":false,"title":"공포","lines":["① 학부 학생회장은 회칙 개정이 의결되면 개정안 정리를 거쳐 지체 없이 공포한다.","② 회칙의 공포문에는 다음 각호의 사항이 포함되어야 한다. 단, 회칙 개정안이 전부개정안이면 신ㆍ구조문 대비표를 생략할 수 있다.","1. 회칙 개정안의 제안 이유와 주요 내용","2. 신ㆍ구조문 대비표 및 해당 개정안 전문","3. 제194조에 따른 회칙 개정안 발의자 명단","4. 회칙 개정 찬성자 명단","③ 회칙을 온라인으로 배포할 때는 조문의 수정이 불가능한 파일로 배포한다.","④ 학부운영위원회는 학부 학생회장이 개정 의결된 회칙의 공포를 정당한 사유 없이 상당한 기간 지체하였다고 인정할 때는 해당 개정안을 의결로 공포할 수 있다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제1절 회칙 개정"},{"no":201,"sub":0,"add":false,"title":"세칙","lines":["세칙은 회칙에서 위임한 사항과 회칙을 시행하기 위한 사항을 규정한다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제2절 세칙"},{"no":202,"sub":0,"add":false,"title":"세칙의 제정ㆍ개정ㆍ폐지","lines":["① 세칙의 제정ㆍ개정ㆍ폐지는 제61조 제3항에 따라 학생대표자회 재적 대의원 과반수의 출석과 출석 대의원 3분의 2 이상의 찬성으로 의결한다.","② 세칙 제정의 공포 시에는 세칙의 제정 순서에 따라 번호를 붙여서 공포한다.","③ 그 밖의 세칙의 제정ㆍ개정ㆍ폐지에 관하여서는 제194조부터 제200조까지를 준용한다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제2절 세칙"},{"no":203,"sub":0,"add":false,"title":"규칙","lines":["① 규칙은 회칙 및 세칙에서 위임한 사항 및 그 밖에 본회의 운영에 필요한 사항을 규정한다.","② 규칙은 다음 각호에 따라 나눈다.","1. 세칙에 부수된 규칙: 세칙의 시행 및 운영 등에 필요한 사항","2. 일반규칙: 규칙을 통하여 일반적으로 규정이 필요한 사항","3. 임시규칙: 규칙을 통하여 한시적으로 규정이 필요한 사항","③ 규칙의 제정ㆍ개정ㆍ폐지의 의결은 제87조 제3항에 따라 기명투표로 표결한다.","④ 규칙 제정의 공포 시에는 규칙의 제정 순서에 따라 번호를 붙여서 공포한다. 단, 세칙에 부수된 규칙은 그 제정의 근거가 된 세칙별로 번호를 붙인다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제3절 규칙"},{"no":204,"sub":0,"add":false,"title":"규칙의 제정ㆍ개정ㆍ폐지","lines":["① 학부운영위원회는 제96조 제3항 및 각 세칙으로 정한 바에 따라 세칙에 부수된 규칙을 제정ㆍ개정ㆍ폐지할 수 있다.","② 학부운영위원회는 제96조 제4항에 따라 일반규칙 및 임시규칙을 제정ㆍ개정ㆍ폐지할 수 있다."],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제3절 규칙"},{"no":205,"sub":0,"add":false,"title":"회칙 해석의 원칙","lines":["① 회칙을 해석ㆍ적용함에 있어서는 해당 조항의 문맥적 의미와 회칙 전체의 논리적 체계성에 비추어 본회의 민주적 운영이 저해되거나 회원의 권리가 부당하게 침해되지 않도록 주의하여야 한다.","② 본회의 중요 사항과 회원의 권리ㆍ의무에 중대한 변화를 불러오는 회칙의 해석은 본회의 회원을 상대로 의견을 수렴하기 위한 공청회를 개최할 수 있다.","③ 세칙ㆍ규칙에 관하여서도 본조를 적용한다.","④ 다음 각호에 해당하는 세칙ㆍ규칙 및 자치규칙은 그 위반되는 부분에 한정하여 효력이 없다.","1. 회칙에 위반되는 세칙","2. 회칙 및 세칙에 위반되는 규칙","3. 회칙에 위반되는 산하기구 및 특별기구의 자치규칙"],"ch":"제10장 회칙ㆍ세칙ㆍ규칙","sec":"제4절 해석"},{"no":205,"sub":2,"add":false,"title":"회칙해석위원회","lines":["① 학부운영위원회 의장은 회칙의 해석에 문제가 발생한 때에는 지체 없이 회칙해석위원회를 소집한다.","② 회칙해석위원회의 구성은 학부운영위원으로 하며, 그 운영 및 회의 진행에 관하여서는 제78조 및 「고려대학교 총학생회 회의진행세칙」에서 정한 바에 따른다.","③ 회칙해석위원회의 소집은 소집일 3일 전까지 공고되어야 하며, 이때 해석에 이견이 발생한 회칙 조항과 그 조항의 해석에 관한 각 측의 주장이 공개되어야 한다. 다만, 긴급한 사항은 회칙해석위원회 재적 위원 3분의 2 이상의 동의로 공고를 생략할 수 있다.","④ 회칙해석위원회 의장은 위원의 요청 등에 의하여 필요하다고 인정되는 때에는 전문가를 위원회에 출석시켜 발언하게 하거나 전문가 명의의 자료 제출을 요청할 수 있다.","⑤ 이 회의 중요 사항과 회원의 권리 및 의무에 관한 회칙의 해석은 회원들을 상대로 의견을 수렴하기 위한 공청회를 개최할 수 있다.","⑥ 회칙해석위원회가 조항의 해석을 의결한 때에는 회의의 논의 과정과 해석 내용을 규정집에 첨부하여 항상 회칙과 함께 열람할 수 있도록 하여야 한다.","⑦ 세칙ㆍ규칙 및 자치규칙의 해석에 관하여서도 제1항부터 제6항까지를 적용한다. 다만, 회칙해석위원회는 산하기구 및 특별기구의 요청이 있는 때에만 그 자치규칙에 관 const wq = [];            // { key, items } 또는 { call:[함수, 인자…], after }
let wBusy = false, wFail = 0;
function queueCall(call, after) { wq.push({ call, after }); renderPend(); pump(); }
function queueWrite(key, items) {
    if (!items || !items.length) return;
    const last = wq[wq.length - 1];
    if (last && last.key === key && !last.call) last.items.push(...items); else wq.push({ key, items: items.slice() });
    renderPend();
    pump();
}
async function pump() {
    if (wBusy) return;
    wBusy = true;
    try {
        while (wq.length) {
            const job = wq[0];
            try {
                if (job.call) { const r = await gs(...job.call); wq.shift(); wFail = 0; if (job.after) job.after(r); }
                else { const r = await gs('write', job.key, job.items); if (r && r.warn) toast(r.warn); wq.shift(); wFail = 0; }
            } catch (e) {
                wFail++;
                renderPend(e);
                await sleep(Math.min(8000, 1500 * wFail));
            }
            renderPend();
        }
    } finally { wBusy = false; renderPend(); }
}
function renderPend(err) {
    const n = wq.reduce((a, j) => a + (j.items ? j.items.length : 1), 0);
    $('pend').innerHTML = n ? (err ? `<span class="warn">⚠ 문서에 쓰지 못해 다시 시도 중 (${n}줄 대기) — ${esc(err.message)}</span>` : `문서에 쓰는 중… ${n}줄`) : '';
}
