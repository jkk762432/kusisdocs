const withTimeout = (p, ms) => Promise.race([p, new Promise((_, no) => setTimeout(() => no(new Error('시간 초과')), ms))]);
const sha256 = async str => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)))].map(b => b.toString(16).padStart(2, '0')).join('');
const fbErr = e => { const c = String((e && (e.code || e.message)) || ''); return /PERMISSION|permission/.test(c) ? '권한이 없습니다 (로그인 또는 규칙 확인)' : /invalid|wrong-password|user-not-found|credential/.test(c) ? '이메일 또는 비밀번호가 맞지 않습니다' : /network|timeout|시간/.test(c) ? '인터넷 연결을 확인해 주세요' : (e && e.message) || '알 수 없는 오류'; };

let R = { on: false, busy: false, err: '' };
let P = {}, SP = {}, FL = null, flSeen = 0, flSig = '';
let refs = {};
const applied = new Set();
const recentSig = {};
const spSeen = {};

const joinedMembers = () => [...new Set(Object.values(P).filter(x => x && x.role === 'member' && x.name).map(x => x.name))];
const observers = () => Object.values(P).filter(x => x && x.role === 'observer');

async function doLogin(email, pw) {
    await loadFb();
    await withTimeout(firebase.auth().signInWithEmailAndPassword(email, pw), 15000);
    C.email = email; saveCfg();
}
async function doLogout() { await loadFb(); await firebase.auth().signOut(); }

async function publishPinProofs() {
    const pins = (await withTimeout(DB.ref('config/pins').once('value'), 15000)).val() || {};
    const out = {};
    for (const [n, pin] of Object.entries(pins)) if (pin) out[n] = await sha256(`${n}|${pin}|gakbu-v1`);
    await withTimeout(DB.ref('liveAuth').set(Object.keys(out).length ? out : null), 15000);
    return Object.keys(out).length;
}

/** 사이드바를 닫았다 다시 열어도 회의 중이면 회의실에 자동으로 다시 연결 */
let stateLoaded = false;
function maybeRejoin() { if (stateLoaded && U && !R.on && !R.busy && S.phase === 'meeting') openRoom(); }
async function openRoom() {
    if (R.busy || R.on) return;
    R.busy = true; R.err = ''; renderAll();
    try {
        await loadFb();
        if (!U) throw new Error('먼저 위원회 계정으로 로그인해 주세요.');
        const ref = DB.ref('rooms/live');
        const cur = (await withTimeout(ref.once('value'), 15000)).val();
        if (cur && cur.online && cur.owner !== U.uid) throw new Error(`이미 진행 중인 회의가 있습니다${cur.view && cur.view.meetingName ? ` ("${cur.view.meetingName}")` : ''}. 그 회의가 끝난 뒤 다시 시도해 주세요.`);
        const keep = !!(cur && cur.owner === U.uid && cur.view && cur.view.phase === 'meeting' && S.phase === 'meeting');
        if (!keep) { await withTimeout(DB.ref('liveIn').remove(), 15000); applied.clear(); S.applied = []; }
        await withTimeout(ref.update({ owner: U.uid, online: true, createdAt: firebase.database.ServerValue.TIMESTAMP }), 15000);
        const np = await publishPinProofs();
        if (!np) toast('위원 비밀번호가 아직 없습니다 — 설정 탭에서 먼저 정해 주세요.');
        ref.child('online').onDisconnect().set(false);
        refs.room = ref;
        refs.presence = DB.ref('liveIn/presence'); refs.presence.on('value', s => { P = s.val() || {}; trackAttendance(); renderAll(); });
        refs.inbox = DB.ref('liveIn/inbox'); refs.inbox.on('child_added', handleInbox);
        refs.speaking = DB.ref('liveIn/speaking'); refs.speaking.on('value', s => { SP = s.val() || {}; renderLiveStrip(); publishLive(); });
        refs.floor = DB.ref('liveIn/floor'); refs.floor.on('value', s => { FL = s.val(); const sig = JSON.stringify(FL); if (sig !== flSig) { flSig = sig; flSeen = Date.now(); } renderLiveStrip(); });
        R.on = true;
        publishNow(); publishLive();
    } catch (e) { console.error(e); R.err = fbErr(e); }
    finally { R.busy = false; renderAll(); }
}

async function closeRoom() {
    if (!R.on) return;
    clearTimeout(pubT); clearTimeout(liveT);
    ['presence', 'inbox', 'speaking', 'floor'].forEach(k => { if (refs[k]) refs[k].off(); });
    const ref = refs.room; refs = {}; R.on = false; P = {}; SP = {}; FL = null;
    try { await ref.child('online').onDisconnect().cancel(); await ref.remove(); await DB.ref('liveIn').remove(); } catch (e) { console.error(e); }
    renderAll();
}

/* 다른 기기에서 말하는 중인 글자 (확정 전) — 사이드바 위에 보여 주고, 신호가 끊긴 것은 지움 */
function liveSpeakers() {
    const now = Date.now(), out = [];
    Object.keys(SP).forEach(k => {
        const x = SP[k]; if (!x || !x.name) return;
        const sig = JSON.stringify([x.text, x.hb]);
        if (!spSeen[k] || spSeen[k].sig !== sig) spSeen[k] = { sig, at: now };
        if (now - spSeen[k].at > 15000) { if (U) DB.ref(`liveIn/speaking/${k}`).remove().catch(() => {}); return; }
        out.push({ k, name: x.role === 'observer' ? `참관인 ${x.name}` : x.name, text: String(x.text || '') });
    });
    Object.keys(spSeen).forEach(k => { if (!SP[k]) delete spSeen[k]; });
    if (FL && refs.floor && now - flSeen > FLOOR_STALE + 3000) { const fr = refs.floor; FL = null; flSig = 'null'; fr.remove().catch(() => {}); }
    return out;
}
function renderLiveStrip() {
    const el = $('r-live'); if (!el) return;
    const on = R.on && S.phase === 'meeting' && !S.recess;
    const l = on ? liveSpeakers() : [];
    el.innerHTML = l.map(x => `<div class="live"><b>${esc(x.name)}</b> ${x.text ? esc(x.text.slice(-120)) : '듣는 중…'}</div>`).join('');
}
setInterval(renderLiveStrip, 2000);

/* 위원·참관인 발언 수신 → 문서 */
const speakerLabel = name => name === S.chair ? `${name}(의장)` : name;
function handleInbox(snap) {
    const id = snap.key, v = snap.val();
    const done = () => snap.ref.remove().catch(() => {});
    if (applied.has(id)) { done(); return; }
    if (!v || typeof v.text !== 'string' || typeof v.name !== 'string') { done(); return; }
    if (S.phase !== 'meeting' || S.recess) { done(); return; }
    const text = v.text.replace(/\s+/g, ' ').trim().slice(0, 2000);
    if (!text) { done(); return; }
    let who;
    if (v.role === 'member') { if (!S.members.includes(v.name)) { done(); return; } who = speakerLabel(v.name); }
    else who = `참관인 ${v.name.slice(0, 20)}`;
    const sig = (v.device || v.name) + '|' + text, now = Date.now();
    applied.add(id); S.applied.push(id);
    if (text.length >= 6 && recentSig[sig] && now - recentSig[sig] < 20000) { done(); return; }
    recentSig[sig] = now;
    addLine({ t: 'msg', s: who, x: text });
    done();
}

/* ----- 위원 입·퇴장 (개의 뒤): 접속 기준으로 출석을 따라감 ----- */
const leaveT = {};
function trackAttendance() {
    if (S.phase !== 'meeting') return;
    const joined = joinedMembers();
    joined.forEach(n => {
        if (leaveT[n]) { clearTimeout(leaveT[n]); delete leaveT[n]; }
        if (S.members.includes(n) && !S.present.includes(n)) {
            S.present.push(n); S.present.sort((a, b) => S.members.indexOf(a) - S.members.indexOf(b));
            addLine({ t: 'note', x: `${n} 입장 (${hhmm()})`, feed: `${n} 입장` });
        }
    });
    S.present.slice().forEach(n => {
        if (!joined.includes(n) && !leaveT[n]) leaveT[n] = setTimeout(() => {
            delete leaveT[n];
            if (joinedMembers().includes(n) || !S.present.includes(n) || !R.on) return;
            S.present = S.present.filter(x => x !== n);
            addLine({ t: 'note', x: `${n} 퇴장 (${hhmm()})`, feed: `${n} 퇴장` });
            renderAll();
        }, 20000);
    });
}

/* ----- 화면 공유 (rooms/live/view · live) ----- */
const curAgenda = () => S.agendas.find(a => a.key === S.cur.key) || null;
const curKey = () => S.cur.key || S.lastKey || "open";
function numbers() {
    const n = {}, cnt = {};
    S.agendas.forEach(a => { if (a.status === 'rejected') return; cnt[a.type] = (cnt[a.type] || 0) + 1; n[a.key] = cnt[a.type]; });
    return n;
}
const labelOf = a => `${a.type} ${numbers()[a.key] || ''}`.trim();
function statusText() {
    if (S.phase === 'ended') return '산회';
    if (S.phase === 'setup') return '회의 시작 전';
    if (S.recess) return '정회 중';
    const l = liveSpeakers();
    return l.length ? `${l[0].name} 발언 중` : '회의 중';
}
function viewSnapshot() {
    const item = curAgenda();
    return {
        meetingName: S.name || '', allowEdit: false, phase: S.phase, recess: !!S.recess, status: statusText(),
        present: S.present.length, total: S.members.length, members: (S.members.length ? S.members : C.members).slice(),
        chair: '', chairName: S.chair || '', docUrl: C.docUrl || '',
        cur: item ? { label: labelOf(item), type: item.type, title: item.title, step: S.cur.step, current: S.cur.current || '', steps: item.type === DELIB ? FLOW.length : 0 } : null,
        agendas: S.agendas.map(a => ({ label: a.status === 'rejected' ? a.type : labelOf(a), type: a.type, title: a.title, status: a.status, extra: !!a.extra, verdict: a.result ? (a.result.passed ? '가결' : '부결') : '' })),
        html: S.feed.join(''), t: firebase.database.ServerValue.TIMESTAMP
    };
}
let pubT = null, liveT = null, liveLast = 0;
function publishNow() { if (!R.on) return; clearTimeout(pubT); refs.room.child('view').set(viewSnapshot()).catch(e => console.error(e)); }
const schedulePublish = () => { if (!R.on) return; clearTimeout(pubT); pubT = setTimeout(publishNow, 500); };
function publishLive() {
    if (!R.on) return;
    const wait = 250 - (Date.now() - liveLast);
    clearTimeout(liveT);
    if (wait > 0) { liveT = setTimeout(publishLive, wait); return; }
    liveLast = Date.now();
    const l = liveSpeakers()[0];
    refs.room.child('live').set(l ? { speaker: l.name, text: l.text.slice(-400) } : null).catch(() => {});
}

/* ===== 안건 진행 절차 (의장이 총괄 · 심의안건은 정해진 절차) ===== */
let MK = [];                    // 문서의 속기 위치 목록
let V = null;                   // 진행 중인 표결 { kind, type, title, req, sel }
let MOT = null;                 // 토론종결동의 { by }

/* 확인창 (사이드바에서는 confirm 이 막혀 있어 직접 만듦) */
function ask(msg, yes = '확인', no = '취소') {
    return new Promise(res => {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px';
        o.innerHTML = `<div class="card" style="max-width:260px;margin:0"><p style="margin:0 0 10px;white-space:pre-line">${esc(msg)}</p><div class="row"><button class="btn grow" data-r="0">${esc(no)}</button><button class="btn p grow" data-r="1">${esc(yes)}</button></div></div>`;
        o.addEventListener('click', e => { const b = e.target.closest('button[data-r]'); if (!b) return; o.remove(); res(b.dataset.r === '1'); });
        document.body.appendChild(o);
    });
}

/* ----- 문서에 쓰고 + 참관 화면에 싣기 ----- */
function feedHTML(it) {
    switch (it.t) {
        case 'msg': return `<div class="message"><span class="speaker-name">[${esc(it.s)}]</span> <span class="message-text">${esc(it.x)}</span></div>`;
        case 'note': return `<div class="log-note">[ ${esc(it.feed || it.x)} ]</div>`;
        case 'step': return `<div class="step-title">- ${esc(it.x)}</div>`;
        case 'head': return `<div class="agenda-title"><span class="tag">${esc(it.tag || '')}</span> ${esc(it.x)}</div>`;
        case 'kv': return `<div class="meeting-info">${it.title ? `<h2>${esc(it.title)}</h2>` : ''}<table>${it.rows.map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table></div>`;
        case 'result': return `<div class="vote-result"><div class="summary">${esc(it.x)}</div></div>`;
        default: return '';
    }
}
/** it: 항목 또는 항목 배열. noDoc 은 참관 화면에만, feed/tag/title 은 참관 화면용 보조 값 */
function addLine(it, key) {
    const items = Array.isArray(it) ? it : [it];
    queueWrite(key || curKey(), items.filter(x => !x.noDoc).map(x => { const o = Object.assign({}, x); delete o.feed; delete o.tag; delete o.title; return o; }));
    items.forEach(x => { const h = feedHTML(x); if (h) S.feed.push(h); });
    if (S.feed.length > 400) S.feed = S.feed.slice(-300);
    commit(false);
}
function commit(render = true) { saveStateSoon(); schedulePublish(); if (render) renderAll(); else renderRunSoon(); }

/* ----- 속기 위치(표식) → 안건 목록 ----- */
function syncAgendas() {
    const marks = MK.filter(m => m.kind === 'agenda');
    const old = {}; S.agendas.forEach(a => { old[a.key] = a; });
    const list = marks.map(m => {
        const a = old[m.key] || { key: m.key, status: 'pending', result: null };
        a.type = m.type || a.type || '토의안건'; a.title = m.title || a.title || ''; a.extra = !!m.extra;
        return a;
    });
    S.agendas.forEach(a => { if (!list.includes(a) && (a.status === 'rejected' || a.status === 'active' || a.status === 'done')) list.push(a); });
    S.agendas = list;
}
async function refreshMarkers() {
    if (wq.length) return;
    try { MK = await gs('listMarkers'); syncAgendas(); renderAll(); } catch (e) { console.error(e); }
}
const hasMark = k => MK.some(m => m.key === k);

/* ----- 개의 ----- */
async function openMeeting() {
    if (!R.on) { toast('먼저 회의실을 열어 주세요.'); return; }
    await refreshMarkers();
    const members = S.members.length ? S.members : C.members.slice();
    const present = joinedMembers().filter(n => members.includes(n));
    if (!present.length) { toast('입장한 위원이 없습니다.'); return; }
    if (!S.chair || !present.includes(S.chair)) { toast('입장한 위원 중에서 의장을 지정해 주세요.'); return; }
    const quorumOk = present.length * 2 > members.length;
    if (!quorumOk && !(await ask(`출석 ${present.length}명은 재적 ${members.length}명의 과반에 미달합니다 (회칙 제86조).\n그래도 개의할까요?`, '개의'))) return;
    S.members = members; S.present = present.slice(); S.phase = 'meeting'; S.recess = false; S.openedAt = hhmm();
    S.name = S.name || C.name || '학부운영위원회';
    const absent = members.filter(m => !present.includes(m));
    const ags = S.agendas.filter(a => a.status !== 'rejected');
    const rows = [['일시', koDate()], S.place ? ['장소', S.place] : null, ['개의 시간', S.openedAt], ['의장', S.chair], ['속기자', C.recorder || '미지정'],
        ['참석 현황', `재적 ${members.length}명 / 출석 ${present.length}명 — ${quorumOk ? '개의요건 충족' : '개의요건 미충족(과반 미달)'}`], ['출석', present.join(', ')]];
    if (absent.length) rows.push(['불참', absent.join(', ')]);
    if (ags.length) rows.push(['안건', ags.map(a => `[${labelOf(a)}] ${a.title}`).join('\n')]);
    S.cur = { key: null, step: 0, current: '' }; S.lastKey = 'open';
    addLine([{ t: 'kv', rows: rows.filter(Boolean), title: S.name }, { t: 'note', x: `개의 (${S.openedAt})` }], 'open');
    commit();
}

/* ----- 안건 상정 ----- */
function startAgenda(key, opts = {}) {
    const a = S.agendas.find(x => x.key === key); if (!a || S.cur.key) return;
    a.status = 'active'; S.cur = { key, step: 0, current: '' }; S.lastKey = key;
    const delib = a.type === DELIB;
    const lines = [{ t: 'head', x: a.title, tag: `[${labelOf(a)}]`, noDoc: true }, { t: 'note', x: `${opts.extra ? '추가 안건 · ' : ''}안건 상정 (${hhmm()})` }];
    if (delib) { S.cur.step = 1; S.cur.current = FLOW[0]; lines.push({ t: 'step', x: FLOW[0] }); }
    addLine(lines, key);
    commit();
}
function nextStep() {
    const a = curAgenda(); if (!a || a.type !== DELIB) return;
    const idx = FLOW.indexOf(S.cur.current); if (idx < 0 || idx >= 2) return;
    const t = FLOW[S.cur.step]; S.cur.step++; S.cur.current = t;
    addLine({ t: 'step', x: t }); commit();
}
function motionResult(ok) {
    const by = MOT.by; MOT = null;
    if (!ok) { addLine([{ t: 'msg', s: speakerLabel(by), x: '토론종결동의 제출' }, { t: 'note', x: '토론종결동의 불성립 — 찬반 토론 계속' }]); commit(); return; }
    const rest = FLOW.slice(S.cur.step);
    addLine([{ t: 'msg', s: speakerLabel(by), x: '토론종결동의 제출' }, { t: 'note', x: '토론종결동의 성립' }].concat(rest.map(x => ({ t: 'step', x }))));
    S.cur.step = FLOW.length; S.cur.current = FLOW[FLOW.length - 1];
    commit();
    startVote({ kind: 'agenda' });
}

/* ----- 표결 ----- */
const motionNeed = n => Math.ceil(n * 2 / 3);
function voteRule() {
    const n = S.present.length, novote = S.present.filter(m => V.sel[m] === '의결권없음').length;
    if (V.kind === 'motion' || V.req === 'twothirds') return { need: motionNeed(n), base: n, label: V.kind === 'motion' ? '상정 요건' : '의결 요건', text: `출석 ${n}인의 2/3 이상, 즉 ${motionNeed(n)}인 이상 찬성` };
    const valid = n - novote;
    return { need: Math.floor(valid / 2) + 1, base: valid, label: '의결 요건', text: `유효 투표 ${valid}인(의결권 없음 제외)의 과반, 즉 ${Math.floor(valid / 2) + 1}인 이상 찬성` };
}
async function startVote(mode) {
    if (!S.present.length) { toast('출석 중인 위원이 없습니다.'); return; }
    if (S.present.length * 2 <= S.members.length && !(await ask(`지금 출석은 ${S.present.length}명으로 재적 ${S.members.length}명의 과반에 미달합니다 (회칙 제86조).\n그래도 표결을 진행할까요?`, '진행'))) return;
    V = Object.assign({ req: 'majority', sel: {} }, mode);
    renderAll();
}
function setVote(name, v) { if (V) { V.sel[name] = v; renderVote(); } }
function quickVote(v) { if (!V) return; S.present.forEach(m => { if (!v) delete V.sel[m]; else if (!V.sel[m]) V.sel[m] = v; }); renderVote(); }
function cancelVote() { V = null; renderAll(); }

async function submitVote(consent) {
    if (!V) return;
    const n = S.present.length, total = S.members.length;
    const list = arr => arr.join(', ') || '없음';
    const consentLine = `출석 ${n}인 / 의장이 이의 유무를 물은바 이의가 없으므로`;
    let g = null;
    if (!consent) {
        const unset = S.present.filter(m => !V.sel[m]);
        if (unset.length && !(await ask(`의사를 선택하지 않은 위원이 ${unset.length}명 있습니다.\n(${unset.join(', ')})\n\n기권으로 처리하고 등록할까요?`, '등록'))) return;
        g = { 찬성: [], 반대: [], 기권: [], 의결권없음: [] };
        S.present.forEach(m => g[V.sel[m] || '기권'].push(m));
    }
    const v = V; V = null;
    if (v.kind === 'motion') {
        const need = motionNeed(n), yes = consent ? n : g.찬성.length, ok = consent || yes >= need;
        const rows = consent ? [['결과', `${consentLine} 상정 가결 (이의 없음)`]] : [['찬성', list(g.찬성)], ['반대', list(g.반대)], ['기권', list(g.기권)]].concat(g.의결권없음.length ? [['의결권 없음', list(g.의결권없음)]] : []);
        addLine([{ t: 'step', x: `추가 안건 상정 표결 — ${v.type} 「${v.title}」` }, { t: 'kv', rows },
            { t: 'result', x: consent ? '=> 상정 가결 (이의 없음)' : `출석 ${n}인 / 찬성 ${g.찬성.length}인 / 반대 ${g.반대.length}인 / 기권 ${g.기권.length}인 / 의결권 없음 ${g.의결권없음.length}인 (상정 요건: 출석 2/3 이상 찬성, ${need}인 이상) => 상정 ${ok ? '가결' : '부결'}`, verdict: true, pass: ok }]);
        const key = 'x' + Date.now().toString(36);
        if (ok) {
            S.agendas.push({ key, type: v.type, title: v.title, status: 'pending', extra: true, result: null });
            const no = numbers()[key] || '';
            queueCall(['addExtraMarker', { key, kind: 'agenda', type: v.type, title: v.title, extra: true, label: `${v.type} ${no}`.trim(), head: `[${v.type} ${no}] ${v.title}` }], r => { MK = r; syncAgendas(); renderAll(); });
            toast(`상정 가결 — "${v.title}"`);
            const cur = S.cur.key;
            if (cur) { const a = curAgenda(); finishAgenda(a, null, true); }     // 진행 중이던 안건은 마친 것으로 보고 새 안건 상정

function parseRefs(t) {
    const out = [], re = /(부칙\s*)?제?\s*(\d+)\s*조(?:\s*의\s*(\d+))?/g; let m;
