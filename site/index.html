<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="고려대학교 자유전공학부 학부운영위원회 회의 속기">
<meta name="theme-color" content="#8B0029">
<title>학부운영위원회 속기</title>
<link rel="icon" type="image/png" href="/emblem.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/src/home/style.css">
</head>
<body>
<main class="home">
    <header class="brand">
        <img src="/emblem.png" alt="" width="44" height="58">
        <h1>학부운영위원회 속기</h1>
        <p>고려대학교 자유전공학부</p>
        <div class="live-chip" id="live-chip" hidden></div>
    </header>

    <!-- 1단계: 역할 -->
    <section class="step" id="s-role">
        <h2>어떤 자격으로 들어오시나요?</h2>
        <a class="card" id="c-doc" href="#" hidden><b>회의록 문서 보기</b><span>진행 중인 회의의 구글 독스를 엽니다</span></a>
        <button class="card" data-role="member"><b>위원</b><span>내 기기로 입장해 내 목소리를 기록합니다 · 로그인 불필요</span></button>
        <button class="card" data-role="observer"><b>참관인</b><span>현장 또는 온라인으로 참관합니다 · 로그인 불필요</span></button>
    </section>

    <!-- 참관인: 현장/온라인 -->
    <section class="step" id="s-observer" hidden>
        <button class="back" data-back>← 처음으로</button>
        <h2>참관 방식을 선택하세요</h2>
        <a class="card" href="/view/?role=observer&amp;mode=onsite"><b>현장 참관</b><span>회의장에 있습니다 · 발언 버튼으로 발언을 남길 수 있습니다</span></a>
        <a class="card" href="/view/?role=observer&amp;mode=online"><b>온라인 참관</b><span>멀리서 실시간 속기록을 봅니다 · 보기 전용</span></a>
    </section>

    <footer><button class="link" id="install-btn" hidden>앱으로 설치</button></footer>
</main>
<script type="module" src="/src/home/main.js"></script>
</body>
</html>
